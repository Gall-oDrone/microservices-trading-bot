name: Deploy

on:
  push:
    branches: [ main, staging ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  KUBE_NAMESPACE: 'bitso-trading-platform'
  AWS_REGION: us-east-1

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials (OIDC)
      permissions:
        id-token: write
        contents: read
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME_STAGING }}

    - name: Set ECR registry URLs
      run: |
        AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
        
        cd k8s/overlays/staging
        
        # Install kustomize if not available
        if ! command -v kustomize &> /dev/null; then
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
        fi
        
        # Set image registry for all services
        kustomize edit set image ECR_REGISTRY_PLACEHOLDER/trading-engine=${ECR_REGISTRY}/trading-engine:latest
        kustomize edit set image ECR_REGISTRY_PLACEHOLDER/market-data=${ECR_REGISTRY}/market-data:latest
        kustomize edit set image ECR_REGISTRY_PLACEHOLDER/api-gateway=${ECR_REGISTRY}/api-gateway:latest
        kustomize edit set image ECR_REGISTRY_PLACEHOLDER/strategy-executor=${ECR_REGISTRY}/strategy-executor:latest
        kustomize edit set image ECR_REGISTRY_PLACEHOLDER/order-management=${ECR_REGISTRY}/order-management:latest
        kustomize edit set image ECR_REGISTRY_PLACEHOLDER/backtesting=${ECR_REGISTRY}/backtesting:latest

    - name: Deploy to staging
      run: |
        kubectl apply -k k8s/overlays/staging
        kubectl rollout status deployment/trading-engine -n bitso-trading-staging --timeout=300s
        kubectl rollout status deployment/api-gateway -n bitso-trading-staging --timeout=300s

    - name: Run smoke tests
      run: |
        # Wait for services to be ready
        kubectl wait --for=condition=available --timeout=300s deployment/trading-engine -n bitso-trading-staging
        kubectl wait --for=condition=available --timeout=300s deployment/api-gateway -n bitso-trading-staging
        
        # Get service endpoints
        API_GATEWAY_URL=$(kubectl get service api-gateway -n bitso-trading-staging -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
        
        # Run basic health checks if service has external IP
        if [ -n "$API_GATEWAY_URL" ]; then
          curl -f http://$API_GATEWAY_URL:8085/health || exit 1
        else
          echo "Service not yet exposed externally, skipping external health check"
        fi

  deploy-production:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: production
    needs: []
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials (OIDC)
      permissions:
        id-token: write
        contents: read
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME_PRODUCTION }}

    - name: Set ECR registry URLs
      run: |
        AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
        
        cd k8s/overlays/production
        
        # Install kustomize if not available
        if ! command -v kustomize &> /dev/null; then
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
        fi
        
        # Set image registry for all services
        kustomize edit set image ECR_REGISTRY_PLACEHOLDER/trading-engine=${ECR_REGISTRY}/trading-engine:latest
        kustomize edit set image ECR_REGISTRY_PLACEHOLDER/market-data=${ECR_REGISTRY}/market-data:latest
        kustomize edit set image ECR_REGISTRY_PLACEHOLDER/api-gateway=${ECR_REGISTRY}/api-gateway:latest
        kustomize edit set image ECR_REGISTRY_PLACEHOLDER/strategy-executor=${ECR_REGISTRY}/strategy-executor:latest
        kustomize edit set image ECR_REGISTRY_PLACEHOLDER/order-management=${ECR_REGISTRY}/order-management:latest
        kustomize edit set image ECR_REGISTRY_PLACEHOLDER/backtesting=${ECR_REGISTRY}/backtesting:latest

    - name: Deploy to production
      run: |
        kubectl apply -k k8s/overlays/production
        kubectl rollout status deployment/trading-engine -n bitso-trading-prod --timeout=600s
        kubectl rollout status deployment/api-gateway -n bitso-trading-prod --timeout=600s

    - name: Run production smoke tests
      run: |
        # Wait for services to be ready
        kubectl wait --for=condition=available --timeout=600s deployment/trading-engine -n bitso-trading-prod
        kubectl wait --for=condition=available --timeout=600s deployment/api-gateway -n bitso-trading-prod
        
        # Get service endpoints
        API_GATEWAY_URL=$(kubectl get service api-gateway -n bitso-trading-prod -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
        
        # Run comprehensive health checks if service has external IP
        if [ -n "$API_GATEWAY_URL" ]; then
          curl -f http://$API_GATEWAY_URL:8085/health || exit 1
          curl -f http://$API_GATEWAY_URL:8085/api/v1/market-data/btc-mxn || exit 1
        else
          echo "Service not yet exposed externally, skipping external health check"
        fi

    - name: Notify deployment success
      if: success()
      run: |
        echo "✅ Production deployment successful!"
        # Add Slack/Teams notification here

    - name: Notify deployment failure
      if: failure()
      run: |
        echo "❌ Production deployment failed!"
        # Add Slack/Teams notification here
