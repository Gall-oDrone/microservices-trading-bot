# Manual deploy to development EKS when you need to roll out an existing ECR tag without rebuilding.
# Default push flow: use "Build and Push to ECR" — it builds images and deploys with immutable git-SHA tags.
# Prerequisites:
#   - ECR images already pushed for the chosen tag
#   - AWS Secrets Manager / External Secrets configured
#   - GitHub Environment "development" with AWS_GITHUB_ACTIONS_ROLE_ARN, EKS_CLUSTER_NAME_DEVELOPMENT
name: Deploy (Development)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'ECR image tag (git SHA). Leave empty to use the workflow commit SHA.'
        required: false
        default: ''

env:
  AWS_REGION: us-east-1
  NAMESPACE: bitso-trading-dev

jobs:
  deploy-development:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-development-eks
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          T="${{ inputs.image_tag }}"
          if [ -z "$T" ]; then T="${{ github.sha }}"; fi
          echo "Using ECR tag: $T"
          echo "sha=$T" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME_DEVELOPMENT }}

      - name: Deploy with immutable image tags
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.sha }}"
          cd k8s/overlays/development
          sed -i.bak "s/newTag: latest/newTag: ${TAG}/g" kustomization.yaml
          kubectl apply -k .
          rm -f kustomization.yaml.bak

      - name: Apply ServiceMonitors for Prometheus
        run: |
          kubectl apply -f k8s/monitoring/servicemonitors.yaml
        continue-on-error: true

      - name: Wait for External Secrets sync
        run: |
          echo "Waiting for trading-secrets to be synced from AWS Secrets Manager..."
          for i in $(seq 1 36); do
            if kubectl get secret trading-secrets -n ${{ env.NAMESPACE }} &>/dev/null; then
              echo "trading-secrets synced."
              break
            fi
            if [ $i -eq 36 ]; then
              echo "::warning::trading-secrets not synced in 3m (check SecretStore/ExternalSecret and AWS Secrets Manager)."
              kubectl get externalsecret,secretstore -n ${{ env.NAMESPACE }} || true
              exit 1
            fi
            sleep 5
          done

      - name: Wait for deployments
        run: |
          NS="${{ env.NAMESPACE }}"
          for deploy in kafka redis trading-engine order-management strategy-executor market-data api-gateway backtesting; do
            if kubectl get deployment "$deploy" -n "$NS" &>/dev/null; then
              kubectl rollout status "deployment/$deploy" -n "$NS" --timeout=300s
            fi
          done

      - name: Show status
        run: |
          kubectl get pods,externalsecret,secretstore -n ${{ env.NAMESPACE }}
