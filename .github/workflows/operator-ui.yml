# CI for the operator UI stack: the shared risk and ledger packages, the
# daily-executor (which enforces the risk policy), the read-only ui-api, and
# the web app. Test-only: it builds no images and deploys nothing.
# Plan: docs/frontend/FRONTEND-UI-PLAN-2026-10-03.md (Phase 1b).
name: operator-ui

on:
  # Runs on every branch push that touches these paths. For a pull request
  # from a branch in this repo, the result shows on the PR as a check.
  push:
    paths:
      - '.github/workflows/operator-ui.yml'
      - 'shared/go.mod'
      - 'shared/go.sum'
      - 'shared/pkg/risk/**'
      - 'shared/pkg/dailyledger/**'
      - 'shared/pkg/httpcors/**'
      - 'services/api-gateway/**'
      - 'services/market-data/**'
      - 'services/backtesting/**'
      - 'services/strategy-executor/go.mod'
      - 'services/strategy-executor/go.sum'
      - 'services/strategy-executor/cmd/daily-executor/**'
      - 'services/strategy-executor/internal/dailyexec/**'
      - 'services/strategy-executor/internal/dailyrule/**'
      - 'services/strategy-executor/internal/bitsodaily/**'
      - 'services/strategy-executor/internal/bitsostage/**'
      - 'services/ui-api/**'
      - 'services/trading-engine/**'
      - 'services/order-management/**'
      - 'scripts/kill-switch-drill.sh'
      - 'scripts/k8s-halt.sh'
      - 'scripts/tests/**'
      - 'k8s/base/**'
      - 'k8s/overlays/**'
      - 'scripts/sync-prometheus-rules.sh'
      - 'monitoring/prometheus/**'
      - 'monitoring/alertmanager/**'
      - 'monitoring/grafana/dashboards/**'
      - 'k8s/monitoring/trading-risk-rules.yaml'
      - 'web/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: operator-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (shared, daily-executor, ui-api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ui-api's go.mod needs 1.22; shared and strategy-executor are 1.21
      # modules and build unchanged on it. (build.yml still pins 1.21.)
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: |
            shared/go.sum
            services/strategy-executor/go.sum
            services/ui-api/go.sum

      - name: gofmt (new packages)
        run: |
          out=$(gofmt -l shared/pkg/risk shared/pkg/dailyledger \
            services/strategy-executor/cmd/daily-executor services/ui-api)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: shared
        working-directory: shared
        run: |
          go vet ./pkg/risk ./pkg/dailyledger
          go test -race -count=1 ./pkg/risk ./pkg/dailyledger

      - name: daily-executor
        working-directory: services/strategy-executor
        run: |
          go vet ./cmd/daily-executor ./internal/dailyexec
          go test -race -count=1 ./cmd/daily-executor ./internal/dailyexec

      - name: ui-api
        working-directory: services/ui-api
        run: |
          go vet ./...
          go test -race -count=1 ./...

  platform-risk:
    name: Platform risk R5 (trading-engine, order-management)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # trading-engine's go.mod needs 1.23; order-management (1.21) builds
      # unchanged on it.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: |
            shared/go.sum
            services/trading-engine/go.sum
            services/order-management/go.sum

      # Plan §6.4 R5: session limits and the live-mode start-up guard
      # (internal/guard), the pending-row pre-trade fix and the exposure
      # endpoint in order-management. R5b (§6.4.3): the shared-format policy
      # and halt-file gate in both services. R5d (§6.4.6): order-management's
      # env limits (open orders, order rate) folded into the shared policy.
      - name: gofmt (R5 files)
        run: |
          out=$(gofmt -l services/trading-engine/internal/guard \
            services/trading-engine/internal/execution/exposure.go \
            services/trading-engine/internal/execution/exposure_test.go \
            services/trading-engine/internal/metrics/risk.go \
            services/trading-engine/internal/metrics/risk_test.go \
            services/order-management/internal/server/exposure.go \
            services/order-management/internal/server/exposure_test.go \
            services/order-management/internal/validator/pretrade_duplicate.go \
            services/order-management/internal/risk/shared_policy.go \
            services/order-management/internal/risk/shared_policy_test.go \
            services/order-management/internal/risk/risk_manager.go \
            services/order-management/internal/risk/risk_manager_test.go \
            services/order-management/internal/risk/portfolio.go \
            services/order-management/internal/risk/portfolio_test.go \
            services/order-management/internal/metrics/risk_series.go \
            services/order-management/internal/metrics/risk_series_test.go \
            services/order-management/internal/manager/slippage.go \
            services/order-management/internal/testing/slippage_test.go)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: trading-engine
        working-directory: services/trading-engine
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: order-management
        working-directory: services/order-management
        run: |
          go vet ./...
          go test -race -count=1 ./...

  edge-services:
    name: Edge services §7 (CORS allowlist, read-only gateway)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # api-gateway's go.mod needs 1.24; shared (1.21), market-data (1.21)
      # and backtesting (1.23) build unchanged on it.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: |
            shared/go.sum
            services/api-gateway/go.sum
            services/market-data/go.sum
            services/backtesting/go.sum

      # Plan §7 items 2-4: exact-origin CORS (CORS_ALLOWED_ORIGINS, no "*"),
      # no order/strategy-control/signal routes on the public gateway, and
      # gateway port defaults that match the k8s Services.
      - name: gofmt (§7 files)
        run: |
          out=$(gofmt -l shared/pkg/httpcors \
            services/api-gateway/internal/api \
            services/api-gateway/internal/config \
            services/api-gateway/internal/router/routes.go \
            services/api-gateway/cmd/main.go \
            services/backtesting/internal/server/middleware.go \
            services/backtesting/internal/manager/backtest_manager.go \
            services/backtesting/internal/optimizer/optimizer.go \
            services/backtesting/internal/api/optimizer_handlers.go \
            services/market-data/cmd/main_test.go \
            services/market-data/internal/config/config_test.go \
            services/market-data/internal/processor/trade_processor_test.go \
            services/market-data/internal/publisher \
            services/market-data/internal/websocket/manager_test.go)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: shared httpcors
        working-directory: shared
        run: |
          go vet ./pkg/httpcors
          go test -race -count=1 ./pkg/httpcors

      - name: api-gateway
        working-directory: services/api-gateway
        run: |
          go vet ./...
          go test -race -count=1 ./...

      # internal/testing (e2e) runs without market-data (it tolerates the
      # refused connection). -race guards the 2026-10-08 fixes: the manager
      # now waits for its workers on Stop and optimizations are read through
      # locked snapshots.
      - name: backtesting
        working-directory: services/backtesting
        run: |
          go build ./...
          go test -race -count=1 ./...

      # The stale test packages (cmd, config, processor, publisher, websocket)
      # were ported to the current APIs on 2026-10-08; the whole module is
      # vetted and tested now.
      - name: market-data
        working-directory: services/market-data
        run: |
          go vet ./...
          go test -race -count=1 ./...

  monitoring-rules:
    name: Monitoring rules and dashboards (promtool)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROM_VERSION: '2.53.2'
      AM_VERSION: '0.27.0'
    steps:
      - uses: actions/checkout@v4

      - name: Install promtool
        run: |
          curl -sSL -o /tmp/p.tgz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          tar xzf /tmp/p.tgz -C /tmp --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          /tmp/promtool --version | head -1

      - name: Install amtool
        run: |
          curl -sSL -o /tmp/am.tgz \
            "https://github.com/prometheus/alertmanager/releases/download/v${AM_VERSION}/alertmanager-${AM_VERSION}.linux-amd64.tar.gz"
          tar xzf /tmp/am.tgz -C /tmp --strip-components=1 "alertmanager-${AM_VERSION}.linux-amd64/amtool"
          /tmp/amtool --version 2>&1 | head -1

      # Plan §6.4.7: routing by severity and team, no integrations in the repo.
      - name: Alertmanager routes
        run: AMTOOL=/tmp/amtool scripts/tests/check-alertmanager-routes.sh

      # Plan §6.4.4: every rule file parses, the trading-risk alerts pass their
      # unit tests, and the generated k8s PrometheusRule matches the source.
      - name: promtool check rules
        run: /tmp/promtool check rules monitoring/prometheus/rules/*.yml

      - name: promtool test rules
        run: /tmp/promtool test rules monitoring/prometheus/tests/*.test.yml

      - name: k8s PrometheusRule in sync
        run: scripts/sync-prometheus-rules.sh --check

      - name: dashboards are valid JSON with parseable PromQL
        run: |
          python3 - <<'EOF' > /tmp/exprs.txt
          import glob, json
          for f in glob.glob('monitoring/grafana/dashboards/**/*.json', recursive=True):
              d = json.load(open(f))
              if 'trading-risk-operations' not in f:
                  continue
              for p in d['panels']:
                  for t in p.get('targets', []):
                      print(t['expr'])
          EOF
          n=0
          while IFS= read -r e; do
            /tmp/promtool promql format --experimental "$e" >/dev/null
            n=$((n+1))
          done < /tmp/exprs.txt
          echo "parsed $n expressions"

  drill:
    name: Kill-switch drill (drill-only ui-api, fixture ledger, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: |
            shared/go.sum
            services/strategy-executor/go.sum
            services/ui-api/go.sum

      # Plan §8.14. Copies the checked-in fixture ledger into three scratch
      # ledgers, starts a throwaway ui-api on them (own token, live data off)
      # and runs the 9-step drill: gates, halt-all, the executor's HALTED and
      # fail-closed paths, the ui-alerts subject, the double press, a corrupt
      # halt file, resume. --offline: the executor never reaches Bitso.
      - name: kill-switch drill
        env:
          DRILL_DIR: ${{ runner.temp }}/kill-switch-drill
        run: scripts/kill-switch-drill.sh --offline --keep --source services/ui-api/internal/api/testdata

      # §6.4.5: the cluster kill switch. scripts/k8s-halt.sh against a fake
      # kubectl (refusals, audit log, nudge, read-back, files checked by the
      # real Go halt parser), and every rendered overlay mounts trading-halt
      # into trading-engine and order-management and ships it not halted.
      - name: k8s kill switch
        run: |
          scripts/tests/k8s-halt-test.sh
          for o in development staging production; do
            kubectl kustomize "k8s/overlays/$o" | python3 scripts/tests/check-k8s-halt-wiring.py "$o"
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kill-switch-drill
          path: |
            ${{ runner.temp }}/kill-switch-drill/ui-api.log
            ${{ runner.temp }}/kill-switch-drill/*/ui-audit.jsonl
            ${{ runner.temp }}/kill-switch-drill/*/risk-state.json
          retention-days: 7

  web:
    name: Web (typecheck, lint, format, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run ci

  e2e:
    name: Web e2e (Playwright smoke, desktop + phone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      # Builds the app with VITE_MOCK=1 and serves it with `vite preview`;
      # the API is the captured fixtures, so no backend is needed.
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
