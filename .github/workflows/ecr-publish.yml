name: Build and Push to ECR

on:
  push:
    branches: [ main, staging, feat/eks-infrastructure-baseline, feat/k8s-deployment-manifests ]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ECR_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  IMAGE_PREFIX: microservices-trading-bot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        service: [trading-engine, backtesting, strategy-executor, strategy-router, market-data, order-management, api-gateway]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: ecr-login
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set image vars
      id: vars
      run: |
        REPO=${{ matrix.service }}
        ECR_REGISTRY="${{ env.ECR_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
        echo "repo=${REPO}" >> $GITHUB_OUTPUT
        echo "image=${ECR_REGISTRY}/${REPO}" >> $GITHUB_OUTPUT

    - name: Ensure ECR repo exists (no-op if present)
      run: |
        aws ecr describe-repositories --repository-names "${{ steps.vars.outputs.repo }}" >/dev/null 2>&1 || \
        aws ecr create-repository --repository-name "${{ steps.vars.outputs.repo }}" >/dev/null

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v5
      env:
        DOCKER_BUILDKIT: 1
      with:
        context: .
        file: ./services/${{ matrix.service }}/Dockerfile
        push: true
        tags: |
          ${{ steps.vars.outputs.image }}:${{ github.sha }}
          ${{ steps.vars.outputs.image }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deploy after all images exist in ECR, using immutable git-SHA tags (not :latest) so pods roll reliably.
  deploy-development:
    name: Deploy (Development)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-development-eks
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      NAMESPACE: bitso-trading-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME_DEVELOPMENT }}

      - name: Deploy with immutable image tags
        run: |
          set -euo pipefail
          TAG="${{ github.sha }}"
          cd k8s/overlays/development
          sed -i.bak -E "s/newTag: .*/newTag: ${TAG}/g" kustomization.yaml
          kubectl apply -k .
          rm -f kustomization.yaml.bak

      - name: Apply ServiceMonitors for Prometheus
        run: kubectl apply -f k8s/monitoring/servicemonitors.yaml
        continue-on-error: true

      - name: Wait for External Secrets sync
        run: |
          echo "Waiting for trading-secrets to be synced from AWS Secrets Manager..."
          for i in $(seq 1 36); do
            if kubectl get secret trading-secrets -n ${{ env.NAMESPACE }} &>/dev/null; then
              echo "trading-secrets synced."
              break
            fi
            if [ $i -eq 36 ]; then
              echo "::warning::trading-secrets not synced in 3m (check SecretStore/ExternalSecret and AWS Secrets Manager)."
              kubectl get externalsecret,secretstore -n ${{ env.NAMESPACE }} || true
              exit 1
            fi
            sleep 5
          done

      - name: Wait for deployments
        run: |
          NS="${{ env.NAMESPACE }}"
          for deploy in kafka redis trading-engine order-management strategy-executor strategy-router market-data api-gateway backtesting; do
            if kubectl get deployment "$deploy" -n "$NS" &>/dev/null; then
              kubectl rollout status "deployment/$deploy" -n "$NS" --timeout=300s
            fi
          done

      - name: Show status
        run: kubectl get pods,externalsecret,secretstore -n ${{ env.NAMESPACE }}
