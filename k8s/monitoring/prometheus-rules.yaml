apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trading-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app: kube-prometheus-stack
spec:
  groups:
    - name: trading-alerts
      rules:
        # Service down
        - alert: TradingServiceDown
          expr: up{namespace="bitso-trading-dev"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Service {{ $labels.service }} is down"
            description: "Service {{ $labels.service }} has been down for more than 1 minute"

        # High error rate
        - alert: TradingServiceHighErrorRate
          expr: rate(api_gateway_http_requests_total{status=~"5.."}[5m]) > 0.1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "High error rate on {{ $labels.service }}"
            description: "Error rate is {{ $value }} errors per second"

        # High latency
        - alert: TradingServiceHighLatency
          expr: histogram_quantile(0.95, rate(api_gateway_http_request_duration_seconds_bucket[5m])) > 2
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "High latency on API Gateway"
            description: "95th percentile latency is {{ $value }}s"

        # Pod restart
        - alert: TradingPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="bitso-trading-dev"}[1h]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is restarting frequently"
            description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last hour"

        # High memory usage
        - alert: TradingServiceHighMemory
          expr: container_memory_usage_bytes{namespace="bitso-trading-dev"} / container_spec_memory_limit_bytes > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on {{ $labels.container }}"
            description: "Memory usage is at {{ $value | humanizePercentage }}"

    # Strategy router alerts — wrap the most common failure modes of the
    # regime-driven router (services/strategy-router). See
    # docs/strategy-fee-accuracy/POST-POINT-10-ROADMAP-2026-05-22.md §3.
    - name: strategy-router-alerts
      rules:
        # Active strategy is stuck with an open position and the router
        # can't switch out. 60 blocked cycles in 30 m ≈ 30 m of stuck
        # position at the default 30 s polling interval (~2× headroom
        # over a normal max-hold exit).
        - alert: RouterBlockedHasPositionStuck
          expr: sum(increase(strategy_router_blocked_total{reason="has_position"}[30m])) > 60
          for: 10m
          labels:
            severity: warning
            service: strategy-router
          annotations:
            summary: "strategy-router blocked by open position for > 30m"
            description: "Active strategy has held an open position for >30m; router has refused {{ $value }} switches in the last 30m. Inspect: kubectl -n bitso-trading-dev port-forward svc/strategy-router 8092:8092 && curl localhost:8092/api/v1/router/state"

        # strategy-executor unreachable / snapshot fetch errors.
        - alert: RouterEvaluationsFailing
          expr: sum(increase(strategy_router_evaluation_errors_total[5m])) > 5
          for: 2m
          labels:
            severity: warning
            service: strategy-router
          annotations:
            summary: "strategy-router evaluations failing"
            description: "{{ $value }} evaluation errors in the last 5m — likely strategy-executor connectivity or snapshot fetch issues."

        # Router loop died (process crashed, AutoStart=false, ticker stalled).
        - alert: RouterNotEvaluating
          expr: sum(rate(strategy_router_evaluations_total[5m])) == 0
          for: 5m
          labels:
            severity: critical
            service: strategy-router
          annotations:
            summary: "strategy-router has stopped evaluating"
            description: "No evaluation cycles in the last 5m. Router loop may be dead, ROUTER_AUTOSTART may be false, or the ticker stalled."
