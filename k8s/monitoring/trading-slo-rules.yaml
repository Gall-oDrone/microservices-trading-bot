            slo: fill_quality
            team: trading
            kind: event
        - record: slo:events:3d
          expr: sum(increase(order_arrival_slippage_bps_count{job=~"order-management.*"}[3d]))
          labels:
            slo: fill_quality
        - record: slo:min_events:3d
          expr: vector(30)
          labels:
            slo: fill_quality
        - record: slo:error_ratio:30d
          expr: clamp(1 - (sum(rate(order_arrival_slippage_bps_bucket{job=~"order-management.*",le="25"}[30d]))) / (sum(rate(order_arrival_slippage_bps_count{job=~"order-management.*"}[30d]))), 0, 1)
          labels:
            slo: fill_quality
            team: trading
            kind: event
        - record: slo:events:30d
          expr: sum(increase(order_arrival_slippage_bps_count{job=~"order-management.*"}[30d]))
          labels:
            slo: fill_quality
        - record: slo:target
          expr: vector(0.995)
          labels:
            slo: reconciliation_freshness
            team: trading
            kind: time
        - record: slo:good:bool
          expr: min( ((time() - bitso_sync_last_success_timestamp_seconds{job=~"order-management.*"}) <= bool 120) and on (job, instance) (bitso_sync_last_success_timestamp_seconds{job=~"order-management.*"} > bool 0) ) * on () group_left () min( ((time() - user_trades_last_poll_timestamp_seconds{job=~"order-management.*"}) <= bool 120) and on (job, instance) (user_trades_last_poll_timestamp_seconds{job=~"order-management.*"} > bool 0) )
          labels:
            slo: reconciliation_freshness
            team: trading
            kind: time
        - record: slo:error_ratio:5m
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="reconciliation_freshness"}[5m]), 0, 1)
          labels:
            slo: reconciliation_freshness
            team: trading
            kind: time
        - record: slo:error_ratio:30m
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="reconciliation_freshness"}[30m]), 0, 1)
          labels:
            slo: reconciliation_freshness
            team: trading
            kind: time
        - record: slo:error_ratio:1h
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="reconciliation_freshness"}[1h]), 0, 1)
          labels:
            slo: reconciliation_freshness
            team: trading
            kind: time
        - record: slo:error_ratio:2h
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="reconciliation_freshness"}[2h]), 0, 1)
          labels:
            slo: reconciliation_freshness
            team: trading
            kind: time
        - record: slo:error_ratio:6h
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="reconciliation_freshness"}[6h]), 0, 1)
          labels:
            slo: reconciliation_freshness
            team: trading
            kind: time
        - record: slo:error_ratio:1d
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="reconciliation_freshness"}[1d]), 0, 1)
          labels:
            slo: reconciliation_freshness
            team: trading
            kind: time
        - record: slo:error_ratio:3d
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="reconciliation_freshness"}[3d]), 0, 1)
          labels:
            slo: reconciliation_freshness
            team: trading
            kind: time
        - record: slo:error_ratio:30d
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="reconciliation_freshness"}[30d]), 0, 1)
          labels:
            slo: reconciliation_freshness
            team: trading
            kind: time
        - record: slo:target
          expr: vector(0.995)
          labels:
            slo: market_data_freshness
            team: trading
            kind: time
        - record: slo:good:bool
          expr: min(market_data_last_trade_age_seconds{job=~"market-data.*"} <= bool 120)
          labels:
            slo: market_data_freshness
            team: trading
            kind: time
        - record: slo:error_ratio:5m
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="market_data_freshness"}[5m]), 0, 1)
          labels:
            slo: market_data_freshness
            team: trading
            kind: time
        - record: slo:error_ratio:30m
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="market_data_freshness"}[30m]), 0, 1)
          labels:
            slo: market_data_freshness
            team: trading
            kind: time
        - record: slo:error_ratio:1h
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="market_data_freshness"}[1h]), 0, 1)
          labels:
            slo: market_data_freshness
            team: trading
            kind: time
        - record: slo:error_ratio:2h
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="market_data_freshness"}[2h]), 0, 1)
          labels:
            slo: market_data_freshness
            team: trading
            kind: time
        - record: slo:error_ratio:6h
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="market_data_freshness"}[6h]), 0, 1)
          labels:
            slo: market_data_freshness
            team: trading
            kind: time
        - record: slo:error_ratio:1d
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="market_data_freshness"}[1d]), 0, 1)
          labels:
            slo: market_data_freshness
            team: trading
            kind: time
        - record: slo:error_ratio:3d
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="market_data_freshness"}[3d]), 0, 1)
          labels:
            slo: market_data_freshness
            team: trading
            kind: time
        - record: slo:error_ratio:30d
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="market_data_freshness"}[30d]), 0, 1)
          labels:
            slo: market_data_freshness
            team: trading
            kind: time
        - record: slo:target
          expr: vector(0.999)
          labels:
            slo: kill_switch_readiness
            team: risk
            kind: time
        - record: slo:good:bool
          expr: min( ((time() - trading_halt_last_check_timestamp_seconds{job=~"trading-engine.*"}) <= bool 30) * on (job, instance) (trading_halt_files_configured{job=~"trading-engine.*"} > bool 0) or on (job, instance) (trading_engine_dry_run{job=~"trading-engine.*"} == bool 1) )
          labels:
            slo: kill_switch_readiness
            team: risk
            kind: time
        - record: slo:error_ratio:5m
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="kill_switch_readiness"}[5m]), 0, 1)
          labels:
            slo: kill_switch_readiness
            team: risk
            kind: time
        - record: slo:error_ratio:30m
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="kill_switch_readiness"}[30m]), 0, 1)
          labels:
            slo: kill_switch_readiness
            team: risk
            kind: time
        - record: slo:error_ratio:1h
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="kill_switch_readiness"}[1h]), 0, 1)
          labels:
            slo: kill_switch_readiness
            team: risk
            kind: time
        - record: slo:error_ratio:2h
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="kill_switch_readiness"}[2h]), 0, 1)
          labels:
            slo: kill_switch_readiness
            team: risk
            kind: time
        - record: slo:error_ratio:6h
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="kill_switch_readiness"}[6h]), 0, 1)
          labels:
            slo: kill_switch_readiness
            team: risk
            kind: time
        - record: slo:error_ratio:1d
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="kill_switch_readiness"}[1d]), 0, 1)
          labels:
            slo: kill_switch_readiness
            team: risk
            kind: time
        - record: slo:error_ratio:3d
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="kill_switch_readiness"}[3d]), 0, 1)
          labels:
            slo: kill_switch_readiness
            team: risk
            kind: time
        - record: slo:error_ratio:30d
          expr: clamp(1 - avg_over_time(slo:good:bool{slo="kill_switch_readiness"}[30d]), 0, 1)
          labels:
            slo: kill_switch_readiness
            team: risk
            kind: time
    - name: trading-slo-derived
      interval: 1m
      rules:
        - record: slo:burn_rate:5m
          expr: slo:error_ratio:5m / on (slo) group_left () (1 - slo:target)
        - record: slo:burn_rate:30m
          expr: slo:error_ratio:30m / on (slo) group_left () (1 - slo:target)
        - record: slo:burn_rate:1h
          expr: slo:error_ratio:1h / on (slo) group_left () (1 - slo:target)
        - record: slo:burn_rate:2h
          expr: slo:error_ratio:2h / on (slo) group_left () (1 - slo:target)
        - record: slo:burn_rate:6h
          expr: slo:error_ratio:6h / on (slo) group_left () (1 - slo:target)
        - record: slo:burn_rate:1d
          expr: slo:error_ratio:1d / on (slo) group_left () (1 - slo:target)
        - record: slo:burn_rate:3d
          expr: slo:error_ratio:3d / on (slo) group_left () (1 - slo:target)
        - record: slo:burn_rate:30d
          expr: slo:error_ratio:30d / on (slo) group_left () (1 - slo:target)
        - record: slo:sli:30d
          expr: 1 - slo:error_ratio:30d
        - record: slo:budget_remaining:30d
          expr: 1 - slo:burn_rate:30d
    - name: trading-slo-alerts
      rules:
        - alert: TradingSLOBurnFast1H
          expr: |-
            slo:burn_rate:1h{kind="time"} > 14.4
              and on (slo) slo:burn_rate:5m{kind="time"} > 14.4
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: 'SLO {{ $labels.slo }}: burn rate {{ $value | printf "%.1f" }}x over 1h (and 5m)'
            description: 'Error budget burning at 14.4x over 1h and 5m: 2 % of the 30-day budget in 1 h. The runbook lists the SLI''s source metrics and the per-event alerts to read next.'
            runbook_url: docs/runbooks/TRADING-SLO.md#tradingsloburnfast1h
        - alert: TradingSLOBurnFast6H
          expr: |-
            slo:burn_rate:6h{kind="time"} > 6
              and on (slo) slo:burn_rate:30m{kind="time"} > 6
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: 'SLO {{ $labels.slo }}: burn rate {{ $value | printf "%.1f" }}x over 6h (and 30m)'
            description: 'Error budget burning at 6x over 6h and 30m: 5 % of the 30-day budget in 6 h. The runbook lists the SLI''s source metrics and the per-event alerts to read next.'
            runbook_url: docs/runbooks/TRADING-SLO.md#tradingsloburnfast6h
        - alert: TradingSLOBurnSlow6HEvents
          expr: |-
            slo:burn_rate:6h{kind="event"} > 6
              and on (slo) slo:burn_rate:30m{kind="event"} > 6
              and on (slo) slo:events:6h >= on (slo) slo:min_events:6h
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'SLO {{ $labels.slo }}: burn rate {{ $value | printf "%.1f" }}x over 6h (and 30m)'
            description: 'Error budget burning at 6x over 6h and 30m: 5 % of the 30-day budget in 6 h. Low-volume platform: this only fires with enough events in the window (slo:min_events). The runbook lists the SLI''s source metrics and the per-event alerts to read next.'
            runbook_url: docs/runbooks/TRADING-SLO.md#tradingsloburnslow6hevents
        - alert: TradingSLOBurnSlow1D
          expr: |-
            slo:burn_rate:1d{kind="time"} > 3
              and on (slo) slo:burn_rate:2h{kind="time"} > 3
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'SLO {{ $labels.slo }}: burn rate {{ $value | printf "%.1f" }}x over 1d (and 2h)'
            description: 'Error budget burning at 3x over 1d and 2h: 10 % of the 30-day budget in 1 day. The runbook lists the SLI''s source metrics and the per-event alerts to read next.'
            runbook_url: docs/runbooks/TRADING-SLO.md#tradingsloburnslow1d
        - alert: TradingSLOBurnSlow1DEvents
          expr: |-
            slo:burn_rate:1d{kind="event"} > 3
              and on (slo) slo:burn_rate:2h{kind="event"} > 3
              and on (slo) slo:events:1d >= on (slo) slo:min_events:1d
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'SLO {{ $labels.slo }}: burn rate {{ $value | printf "%.1f" }}x over 1d (and 2h)'
            description: 'Error budget burning at 3x over 1d and 2h: 10 % of the 30-day budget in 1 day. Low-volume platform: this only fires with enough events in the window (slo:min_events). The runbook lists the SLI''s source metrics and the per-event alerts to read next.'
            runbook_url: docs/runbooks/TRADING-SLO.md#tradingsloburnslow1devents
        - alert: TradingSLOBurnSlow3D
          expr: |-
            slo:burn_rate:3d{kind="time"} > 1
              and on (slo) slo:burn_rate:6h{kind="time"} > 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'SLO {{ $labels.slo }}: burn rate {{ $value | printf "%.1f" }}x over 3d (and 6h)'
            description: 'Error budget burning at 1x over 3d and 6h: 10 % of the 30-day budget in 3 days. The runbook lists the SLI''s source metrics and the per-event alerts to read next.'
            runbook_url: docs/runbooks/TRADING-SLO.md#tradingsloburnslow3d
        - alert: TradingSLOBurnSlow3DEvents
          expr: |-
            slo:burn_rate:3d{kind="event"} > 1
              and on (slo) slo:burn_rate:6h{kind="event"} > 1
              and on (slo) slo:events:3d >= on (slo) slo:min_events:3d
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'SLO {{ $labels.slo }}: burn rate {{ $value | printf "%.1f" }}x over 3d (and 6h)'
            description: 'Error budget burning at 1x over 3d and 6h: 10 % of the 30-day budget in 3 days. Low-volume platform: this only fires with enough events in the window (slo:min_events). The runbook lists the SLI''s source metrics and the per-event alerts to read next.'
            runbook_url: docs/runbooks/TRADING-SLO.md#tradingsloburnslow3devents
        - alert: TradingSLOBudgetExhausted
          expr: slo:budget_remaining:30d <= 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: 'SLO {{ $labels.slo }}: the 30d error budget is spent ({{ $value | humanizePercentage }} remaining)'
            description: The 30d SLI is below its target. Review the SLO's incidents in the dashboard before adding risk; a negative value says how far over.
            runbook_url: docs/runbooks/TRADING-SLO.md#tradingslobudgetexhausted
