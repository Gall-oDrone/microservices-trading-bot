apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: trading-services
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - bitso-trading-dev
  selector:
    matchLabels:
      app: bitso-trading-platform
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
