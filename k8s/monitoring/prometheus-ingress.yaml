# Prometheus Ingress - shares the same ALB as Grafana (kube-prometheus-stack).
# Use the same group.name as the existing Grafana ingress so both use ALB k8s-monitori-kubeprom-*.
# Access Prometheus at: http://<ALB_HOST>/prometheus/
#
# If the Prometheus UI links break, set Prometheus --web.route-prefix and --web.external-url
# (e.g. in Helm values: prometheus.prometheus.prometheusSpec.routePrefix: /prometheus/
#  and externalUrl: http://<ALB_HOST>/prometheus/)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Must match the existing Grafana ingress group so both use ALB k8s-monitori-kubeprom-*
    alb.ingress.kubernetes.io/group.name: monitori-kubeprom
    alb.ingress.kubernetes.io/group.order: "200"
    alb.ingress.kubernetes.io/healthcheck-path: /-/healthy
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-prometheus
                port:
                  number: 9090
