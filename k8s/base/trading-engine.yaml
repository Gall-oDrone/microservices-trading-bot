apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-engine
  labels:
    app: bitso-trading-platform
    service: trading-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bitso-trading-platform
      service: trading-engine
  template:
    metadata:
      labels:
        app: bitso-trading-platform
        service: trading-engine
    spec:
      containers:
      - name: trading-engine
        image: trading-engine:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: redis-port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: trading-secrets
              key: redis-password
              optional: true
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: redis-db
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: kafka-brokers
        - name: KAFKA_TOPIC_SIGNALS
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: kafka-topic-signals
        - name: STAGE_BITSO_API_KEY
          valueFrom:
            secretKeyRef:
              name: trading-secrets
              key: bitso-api-key
        - name: STAGE_BITSO_API_SECRET
          valueFrom:
            secretKeyRef:
              name: trading-secrets
              key: bitso-api-secret
        - name: BITSO_API_BASE_URL
          value: "https://stage.bitso.com/api"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Basic liveness probe - adjust based on actual health endpoint
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep trading-engine || exit 1"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep trading-engine || exit 1"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: trading-engine
  labels:
    app: bitso-trading-platform
    service: trading-engine
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: bitso-trading-platform
    service: trading-engine

