apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-engine
  labels:
    app: bitso-trading-platform
    service: trading-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bitso-trading-platform
      service: trading-engine
  template:
    metadata:
      labels:
        app: bitso-trading-platform
        service: trading-engine
    spec:
      initContainers:
      - name: wait-for-kafka
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done']
      - name: wait-for-redis
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z redis 6379; do echo waiting for redis; sleep 2; done']
      containers:
      - name: trading-engine
        image: trading-engine:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: redis-port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: trading-secrets
              key: redis-password
              optional: true
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: redis-db
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: kafka-brokers
        - name: KAFKA_TOPIC_SIGNALS
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: kafka-topic-signals
        - name: ORDER_MANAGEMENT_URL
          value: "http://order-management:8082"
        - name: STAGE_BITSO_API_KEY
          valueFrom:
            secretKeyRef:
              name: trading-secrets
              key: bitso-api-key
        - name: STAGE_BITSO_API_SECRET
          valueFrom:
            secretKeyRef:
              name: trading-secrets
              key: bitso-api-secret
        - name: BITSO_API_BASE_URL
          value: "https://stage.bitso.com/api"
        - name: BROKER
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: broker
              optional: true
        - name: ETORO_ENV
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: etoro-env
              optional: true
        - name: ETORO_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: trading-secrets
              key: etoro-public-key
              optional: true
        - name: ETORO_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: trading-secrets
              key: etoro-private-key
              optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Basic liveness probe - adjust based on actual health endpoint
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep trading-engine || exit 1"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep trading-engine || exit 1"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: trading-engine
  labels:
    app: bitso-trading-platform
    service: trading-engine
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: bitso-trading-platform
    service: trading-engine

