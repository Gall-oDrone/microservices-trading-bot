apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: bitso-trading-platform
    service: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bitso-trading-platform
      service: api-gateway
  template:
    metadata:
      labels:
        app: bitso-trading-platform
        service: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8085
          name: http
        env:
        - name: SERVICE_NAME
          value: "api-gateway"
        - name: SERVICE_PORT
          value: "8085"
        - name: TRADING_ENGINE_URL
          value: "http://trading-engine:8080"
        - name: MARKET_DATA_URL
          value: "http://market-data:8083"
        - name: ORDER_MANAGEMENT_URL
          value: "http://order-management:8082"
        - name: STRATEGY_EXECUTOR_URL
          value: "http://strategy-executor:8081"
        - name: BACKTESTING_URL
          value: "http://backtesting:8084"
        - name: RESEARCH_API_ENABLED
          value: "false"
        - name: RESEARCH_AGENT_URL
          value: "http://research-agent.trading-research.svc:8091"
        - name: RESEARCH_S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: research-s3-bucket
              optional: true
        - name: RESEARCH_S3_PREFIX
          value: "research/memos/"
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: kafka-brokers
              optional: true
        - name: KAFKA_TOPIC_SIGNALS
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: kafka-topic-signals
              optional: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8085
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8085
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: bitso-trading-platform
    service: api-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8085
    targetPort: 8085
    protocol: TCP
    name: http
  selector:
    app: bitso-trading-platform
    service: api-gateway

