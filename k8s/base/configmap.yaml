apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-config
  labels:
    app: bitso-trading-platform
data:
  # Redis configuration
  redis-host: "redis"
  redis-port: "6379"
  redis-db: "0"
  
  # Kafka configuration
  kafka-brokers: "kafka:9092"
  kafka-topic-trades: "market-data.trades"
  kafka-topic-orderbook: "market-data.orderbook"
  kafka-topic-ticker: "market-data.ticker"
  kafka-topic-orders: "trading.orders"
  kafka-topic-signals: "trading.signals"
  kafka-topic-orders-placed: "trading.orders.placed"
  
  # Bitso API configuration
  bitso-ws-url: "wss://ws.bitso.com"
  bitso-books: "btc_mxn"
  bitso-channels: "trades"

  # Broker: bitso (default) or etoro
  broker: "bitso"
  # eToro trading environment when BROKER=etoro (demo|real)
  etoro-env: "demo"

  # Agentic news / research (cold path — see k8s/overlays/research)
  kafka-topic-news-agentic: "news.agentic"
  kafka-topic-research-memos: "research.memos"
  research-s3-bucket: "test-financial-news-bucket"

