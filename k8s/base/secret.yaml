apiVersion: v1
kind: Secret
metadata:
  name: trading-secrets
  labels:
    app: bitso-trading-platform
type: Opaque
stringData:
  # Bitso API credentials (staging)
  # These should be base64 encoded in production, or use stringData for plain text
  bitso-api-key: "REPLACE_WITH_YOUR_BITSO_API_KEY"
  bitso-api-secret: "REPLACE_WITH_YOUR_BITSO_API_SECRET"
  
  # Redis password (optional - leave empty if no password)
  redis-password: ""

