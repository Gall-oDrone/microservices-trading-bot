apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app: bitso-trading-platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: trading-secrets
  labels:
    app: bitso-trading-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: trading-secrets
    creationPolicy: Owner
    type: Opaque
  data:
    - secretKey: bitso-api-key
      remoteRef:
        key: trading-bot/bitso-api-key
    - secretKey: bitso-api-secret
      remoteRef:
        key: trading-bot/bitso-api-secret
    - secretKey: redis-password
      remoteRef:
        key: trading-bot/redis-password
        optional: true

