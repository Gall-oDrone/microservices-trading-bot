apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-management
  labels:
    app: bitso-trading-platform
    service: order-management
spec:
  # Single replica: trading.orders.placed uses one consumer-group partition; two replicas caused empty
  # assignments / rebalance noise and competing readers. Scale up only after a dedicated orders-placed worker or sticky assignment.
  replicas: 1
  selector:
    matchLabels:
      app: bitso-trading-platform
      service: order-management
  template:
    metadata:
      labels:
        app: bitso-trading-platform
        service: order-management
    spec:
      initContainers:
      - name: wait-for-kafka
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done']
      - name: wait-for-redis
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z redis 6379; do echo waiting for redis; sleep 2; done']
      containers:
      - name: order-management
        image: order-management:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
          name: http
        env:
        - name: SERVICE_NAME
          value: "order-management"
        - name: SERVICE_PORT
          value: "8082"
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: kafka-brokers
        - name: KAFKA_TOPIC_ORDERS
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: kafka-topic-orders
        - name: KAFKA_CONSUMER_GROUP
          value: "order-management-group"
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: redis-port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: trading-secrets
              key: redis-password
              optional: true
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: redis-db
        - name: TRADING_ENGINE_URL
          value: "http://trading-engine:8080"
        - name: BITSO_API_KEY
          valueFrom:
            secretKeyRef:
              name: trading-secrets
              key: bitso-api-key
        - name: BITSO_API_SECRET
          valueFrom:
            secretKeyRef:
              name: trading-secrets
              key: bitso-api-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep order-management || exit 1"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep order-management || exit 1"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-management
  labels:
    app: bitso-trading-platform
    service: order-management
spec:
  type: ClusterIP
  ports:
  - port: 8082
    targetPort: 8082
    protocol: TCP
    name: http
  selector:
    app: bitso-trading-platform
    service: order-management

