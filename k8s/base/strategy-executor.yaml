apiVersion: apps/v1
kind: Deployment
metadata:
  name: strategy-executor
  labels:
    app: bitso-trading-platform
    service: strategy-executor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bitso-trading-platform
      service: strategy-executor
  template:
    metadata:
      labels:
        app: bitso-trading-platform
        service: strategy-executor
    spec:
      containers:
      - name: strategy-executor
        image: strategy-executor:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: SERVICE_NAME
          value: "strategy-executor"
        - name: SERVICE_PORT
          value: "8081"
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: kafka-brokers
        - name: KAFKA_TOPIC_SIGNALS
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: kafka-topic-signals
        - name: KAFKA_CONSUMER_GROUP
          value: "strategy-executor-group"
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: redis-port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: trading-secrets
              key: redis-password
              optional: true
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: redis-db
        - name: MARKET_DATA_URL
          value: "http://market-data:8083"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep strategy-executor || exit 1"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep strategy-executor || exit 1"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: strategy-executor
  labels:
    app: bitso-trading-platform
    service: strategy-executor
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app: bitso-trading-platform
    service: strategy-executor

