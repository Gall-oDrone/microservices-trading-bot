apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  labels:
    app: bitso-trading-platform
    service: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bitso-trading-platform
      service: redis-exporter
  template:
    metadata:
      labels:
        app: bitso-trading-platform
        service: redis-exporter
    spec:
      containers:
      - name: redis-exporter
        image: oliver006/redis_exporter:v1.64.0
        ports:
        - containerPort: 9121
          name: metrics
        env:
        - name: REDIS_ADDR
          value: "redis:6379"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9121
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /metrics
            port: 9121
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  labels:
    app: bitso-trading-platform
    service: redis-exporter
spec:
  type: ClusterIP
  selector:
    app: bitso-trading-platform
    service: redis-exporter
  ports:
  - port: 9121
    targetPort: 9121
    protocol: TCP
    name: metrics
