apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data
  labels:
    app: bitso-trading-platform
    service: market-data
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bitso-trading-platform
      service: market-data
  template:
    metadata:
      labels:
        app: bitso-trading-platform
        service: market-data
    spec:
      containers:
      - name: market-data
        image: market-data:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8083
          name: http
        env:
        - name: SERVICE_NAME
          value: "market-data"
        - name: SERVICE_PORT
          value: "8083"
        - name: BITSO_WS_URL
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: bitso-ws-url
        - name: BITSO_BOOKS
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: bitso-books
        - name: BITSO_CHANNELS
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: bitso-channels
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: kafka-brokers
        - name: KAFKA_TOPIC_TRADES
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: kafka-topic-trades
        - name: KAFKA_TOPIC_ORDERBOOK
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: kafka-topic-orderbook
        - name: KAFKA_TOPIC_TICKER
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: kafka-topic-ticker
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: redis-port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: trading-secrets
              key: redis-password
              optional: true
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: redis-db
        - name: ENABLE_KAFKA
          value: "true"
        - name: ENABLE_WEBSOCKET
          value: "true"
        - name: ENABLE_CACHE
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8083
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: market-data
  labels:
    app: bitso-trading-platform
    service: market-data
spec:
  type: ClusterIP
  ports:
  - port: 8083
    targetPort: 8083
    protocol: TCP
    name: http
  selector:
    app: bitso-trading-platform
    service: market-data

