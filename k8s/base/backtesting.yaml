apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtesting
  labels:
    app: bitso-trading-platform
    service: backtesting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bitso-trading-platform
      service: backtesting
  template:
    metadata:
      labels:
        app: bitso-trading-platform
        service: backtesting
    spec:
      containers:
      - name: backtesting
        image: backtesting:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8084
          name: http
        env:
        - name: SERVICE_NAME
          value: "backtesting"
        - name: SERVICE_PORT
          value: "8084"
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: kafka-brokers
        - name: KAFKA_TOPIC_TRADES
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: kafka-topic-trades
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: redis-port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: trading-secrets
              key: redis-password
              optional: true
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: redis-db
        - name: MARKET_DATA_URL
          value: "http://market-data:8083"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep backtesting || exit 1"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep backtesting || exit 1"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backtesting
  labels:
    app: bitso-trading-platform
    service: backtesting
spec:
  type: ClusterIP
  ports:
  - port: 8084
    targetPort: 8084
    protocol: TCP
    name: http
  selector:
    app: bitso-trading-platform
    service: backtesting

