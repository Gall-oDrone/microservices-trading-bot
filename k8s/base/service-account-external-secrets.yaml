apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  labels:
    app: bitso-trading-platform
  annotations:
    # IRSA role ARN - will be patched per environment via kustomize
    # Example: eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/eks-external-secrets-role
    eks.amazonaws.com/role-arn: "PLACEHOLDER_ROLE_ARN"
