apiVersion: apps/v1
kind: Deployment
metadata:
  name: strategy-router
  labels:
    app: bitso-trading-platform
    service: strategy-router
spec:
  # Single replica — the router is stateful in-memory (last switch time,
  # ring buffer of recent decisions). The work is light, so HA is not a
  # priority; restart loses the cooldown window only.
  replicas: 1
  selector:
    matchLabels:
      app: bitso-trading-platform
      service: strategy-router
  template:
    metadata:
      labels:
        app: bitso-trading-platform
        service: strategy-router
    spec:
      containers:
      - name: strategy-router
        image: strategy-router:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8092
          name: http
        env:
        - name: STRATEGY_ROUTER_SERVICE_NAME
          value: "strategy-router"
        - name: STRATEGY_ROUTER_PORT
          value: "8092"
        - name: STRATEGY_ROUTER_BOOK
          value: "btc_mxn"
        - name: STRATEGY_EXECUTOR_URL
          value: "http://strategy-executor:8081"
        # Polling cadence — matches the bash router default.
        - name: ROUTER_INTERVAL_SEC
          value: "30"
        - name: COOLDOWN_SECS
          value: "120"
        # Audit log inside the pod; tail with `kubectl exec` or scrape
        # via a sidecar if you need long-term retention. The router
        # also writes one Prometheus counter per switch.
        - name: ROUTER_AUDIT_LOG_PATH
          value: "/tmp/strategy-regime-router.log"
        # Set to "true" for the first few days on stage to see the
        # classifier work without touching the lifecycle endpoints.
        - name: DRY_RUN
          value: "false"
        # Regime thresholds — defaults documented in
        # docs/strategy-fee-accuracy/POINT-10-STRATEGY-REGIME-ROUTER.md.
        - name: ATR_HIGH_VOL_PCT
          value: "1.5"
        - name: ATR_LOW_VOL_PCT
          value: "0.30"
        - name: RSI_OVERBOUGHT
          value: "70"
        - name: RSI_OVERSOLD
          value: "30"
        - name: BB_PB_UPPER
          value: "0.85"
        - name: BB_PB_LOWER
          value: "0.15"
        - name: EMA_DIST_ENTRY_PCT
          value: "0.10"
        # Routing table — set any to "none" to pause trading in that regime.
        - name: ROUTE_LOW_VOL
          value: "mean_reversion_btc_mxn"
        - name: ROUTE_TRENDING_UP
          value: "momentum_btc_mxn"
        - name: ROUTE_TRENDING_DOWN
          value: "momentum_btc_mxn"
        - name: ROUTE_HIGH_VOL
          value: "none"
        - name: ROUTE_NEUTRAL
          value: "mean_reversion_btc_mxn"
        resources:
          requests:
            memory: "64Mi"
            cpu: "20m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8092
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8092
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: strategy-router
  labels:
    app: bitso-trading-platform
    service: strategy-router
spec:
  type: ClusterIP
  ports:
  - port: 8092
    targetPort: 8092
    protocol: TCP
    name: http
  selector:
    app: bitso-trading-platform
    service: strategy-router
