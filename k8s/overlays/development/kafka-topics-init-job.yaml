# One-shot Job to ensure core Kafka topics exist (including market-data.trades).
# Re-run safely: topic creation is idempotent (--if-not-exists).
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  labels:
    app: bitso-trading-platform
    component: kafka-topics-init
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: bitso-trading-platform
        component: kafka-topics-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init-topics
        image: apache/kafka:3.7.0
        command:
        - /bin/bash
        - -ec
        - |
          BROKER="${KAFKA_BROKERS:-kafka:9092}"
          for t in market-data.trades market-data.orderbook market-data.ticker trading.orders trading.signals trading.orders.placed; do
            echo "Ensuring topic $t"
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BROKER" --create --if-not-exists \
              --topic "$t" --partitions 1 --replication-factor 1
          done
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BROKER" --list
        env:
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: trading-config
              key: kafka-brokers
