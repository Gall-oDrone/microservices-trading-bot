apiVersion: apps/v1
kind: Deployment
metadata:
  name: strategy-router
spec:
  template:
    spec:
      containers:
      - name: strategy-router
        env:
        - name: DRY_RUN
          value: "true"
        - name: ROUTE_LOW_VOL
          value: "mean_reversion_btc_mxn"
