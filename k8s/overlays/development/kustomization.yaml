apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

patchesStrategicMerge:
- development-patches.yaml

namespace: bitso-trading-dev

# ECR registry URL will be set via kustomize edit or CI/CD pipeline
# Example: kustomize edit set image ECR_REGISTRY_PLACEHOLDER/trading-engine=ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/trading-engine:latest
images:
- name: ECR_REGISTRY_PLACEHOLDER/api-gateway
  newName: 326105557351.dkr.ecr.us-east-1.amazonaws.com/api-gateway
  newTag: latest
- name: ECR_REGISTRY_PLACEHOLDER/backtesting
  newName: 326105557351.dkr.ecr.us-east-1.amazonaws.com/backtesting
  newTag: latest
- name: ECR_REGISTRY_PLACEHOLDER/market-data
  newName: 326105557351.dkr.ecr.us-east-1.amazonaws.com/market-data
  newTag: latest
- name: ECR_REGISTRY_PLACEHOLDER/order-management
  newName: 326105557351.dkr.ecr.us-east-1.amazonaws.com/order-management
  newTag: latest
- name: ECR_REGISTRY_PLACEHOLDER/strategy-executor
  newName: 326105557351.dkr.ecr.us-east-1.amazonaws.com/strategy-executor
  newTag: latest
- name: ECR_REGISTRY_PLACEHOLDER/trading-engine
  newName: 326105557351.dkr.ecr.us-east-1.amazonaws.com/trading-engine
  newTag: latest
