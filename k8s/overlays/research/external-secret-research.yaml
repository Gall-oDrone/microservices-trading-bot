apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: research-secrets
  labels:
    app: trading-research
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: research-secrets
    creationPolicy: Owner
  data:
    - secretKey: openai-api-key
      remoteRef:
        key: trading-bot/openai-api-key
    - secretKey: anthropic-api-key
      remoteRef:
        key: trading-bot/anthropic-api-key
