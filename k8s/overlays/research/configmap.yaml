apiVersion: v1
kind: ConfigMap
metadata:
  name: research-config
  labels:
    app: trading-research
data:
  news-s3-bucket: "test-financial-news-bucket"
  news-s3-prefix: "news/transformed/crypto/agentic=true/"
  kafka-brokers: "kafka.bitso-trading-dev.svc.cluster.local:9092"
  kafka-topic-news-agentic: "news.agentic"
  kafka-topic-research-memos: "research.memos"
  news-publisher-url: "http://news-publisher:8090"
  broker-target: "etoro"
