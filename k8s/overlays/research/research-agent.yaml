apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-agent
  labels:
    app: trading-research
    service: research-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-research
      service: research-agent
  template:
    metadata:
      labels:
        app: trading-research
        service: research-agent
    spec:
      containers:
      - name: research-agent
        image: research-agent:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8091
          name: http
        env:
        - name: NEWS_PUBLISHER_URL
          valueFrom:
            configMapKeyRef:
              name: research-config
              key: news-publisher-url
        - name: BROKER_TARGET
          valueFrom:
            configMapKeyRef:
              name: research-config
              key: broker-target
        - name: RESEARCH_READ_ONLY
          value: "true"
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: research-config
              key: kafka-brokers
        - name: KAFKA_TOPIC_RESEARCH_MEMOS
          valueFrom:
            configMapKeyRef:
              name: research-config
              key: kafka-topic-research-memos
        - name: KAFKA_PUBLISH_MEMOS
          value: "true"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: research-secrets
              key: openai-api-key
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: research-secrets
              key: anthropic-api-key
              optional: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8091
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8091
          initialDelaySeconds: 30
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: research-agent
  labels:
    app: trading-research
    service: research-agent
spec:
  type: ClusterIP
  ports:
  - port: 8091
    targetPort: 8091
    name: http
  selector:
    app: trading-research
    service: research-agent
