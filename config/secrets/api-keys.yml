apiVersion: v1
kind: Secret
metadata:
  name: api-keys
  namespace: bitso-trading-platform
type: Opaque
data:
  # Base64 encoded values - replace with actual encoded secrets
  bitso-api-key: <base64-encoded-api-key>
  bitso-api-secret: <base64-encoded-api-secret>
  bitso-client-id: <base64-encoded-client-id>
  
  # Database credentials
  postgres-username: <base64-encoded-username>
  postgres-password: <base64-encoded-password>
  
  # Redis password
  redis-password: <base64-encoded-redis-password>
  
  # Kafka credentials
  kafka-username: <base64-encoded-kafka-username>
  kafka-password: <base64-encoded-kafka-password>
  
  # External API keys
  notification-api-key: <base64-encoded-notification-key>
  monitoring-api-key: <base64-encoded-monitoring-key>
