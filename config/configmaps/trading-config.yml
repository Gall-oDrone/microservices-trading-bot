apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-config
  namespace: bitso-trading-platform
data:
  trading.yaml: |
    trading:
      engine:
        max_concurrent_orders: 10
        order_timeout: 30s
        retry_attempts: 3
        retry_delay: 1s
      
      risk:
        max_position_size: 1000.0
        max_daily_loss: 100.0
        stop_loss_percentage: 5.0
        take_profit_percentage: 10.0
      
      strategies:
        default_strategy: "basic"
        strategy_timeout: 60s
        signal_threshold: 0.7
      
      bitso:
        api_url: "https://api.bitso.com"
        websocket_url: "wss://ws.bitso.com"
        rate_limit:
          public_requests_per_minute: 60
          private_requests_per_minute: 30
      
      kafka:
        brokers: ["kafka:9092"]
        topics:
          orders: "trading.orders"
          trades: "trading.trades"
          market_data: "trading.market_data"
          signals: "trading.signals"
      
      redis:
        host: "redis"
        port: 6379
        db: 0
        max_retries: 3
        dial_timeout: 5s
        read_timeout: 3s
        write_timeout: 3s
