# If build fails with "compose build requires buildx 0.17.0 or later", run:
#   export DOCKER_BUILDKIT=0
# then build/up again. Or use scripts/start-backtest-with-stage.sh which sets this.
services:
  # Trading Services
  trading-engine:
    build:
      context: ./services/trading-engine
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVICE_NAME=trading-engine
      - LOG_LEVEL=info
      - METRICS_PORT=8080
    depends_on:
      - kafka
      - redis
      - prometheus
    networks:
      - trading-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  backtesting:
    image: microservices-trading-bot-backtesting
    build:
      context: .
      dockerfile: services/backtesting/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - SERVICE_NAME=backtesting
      - SERVICE_PORT=8084
      - LOG_LEVEL=info
      - METRICS_PORT=8084
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MARKET_DATA_BASE_URL=http://market-data:8083
    depends_on:
      - kafka
      - redis
      - prometheus
    networks:
      - trading-network

  strategy-executor:
    build:
      context: ./services/strategy-executor
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SERVICE_NAME=strategy-executor
      - LOG_LEVEL=info
      - METRICS_PORT=8082
    depends_on:
      - kafka
      - redis
      - prometheus
    networks:
      - trading-network

  market-data:
    image: microservices-trading-bot-market-data
    build:
      context: .
      dockerfile: services/market-data/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - SERVICE_NAME=market-data
      - SERVICE_PORT=8083
      - LOG_LEVEL=info
      - METRICS_PORT=8083
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BITSO_BOOKS=btc_mxn
      - BITSO_CHANNELS=trades
      # Bitso has no stage WebSocket endpoint; production WS is the only option.
      - BITSO_WS_URL=wss://ws.bitso.com
    depends_on:
      - kafka
      - redis
      - prometheus
    networks:
      - trading-network

  order-management:
    build:
      context: ./services/order-management
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      - SERVICE_NAME=order-management
      - SERVICE_PORT=8086
      - LOG_LEVEL=info
      - METRICS_PORT=8086
    depends_on:
      - kafka
      - redis
      - prometheus
    networks:
      - trading-network

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - SERVICE_NAME=api-gateway
      - LOG_LEVEL=info
      - METRICS_PORT=8085
    depends_on:
      - trading-engine
      - backtesting
      - strategy-executor
      - market-data
      - order-management
      - prometheus
    networks:
      - trading-network

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - trading-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - trading-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - trading-network

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    networks:
      - trading-network

  # Logging Stack
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - trading-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - trading-network

  fluentd:
    image: fluent/fluentd:v1.16-debian-1
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./logging/fluentd/fluent.conf:/fluentd/etc/fluent.conf
      - fluentd_data:/var/log/fluentd
    depends_on:
      - elasticsearch
    networks:
      - trading-network

  # Infrastructure Services
  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - trading-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - trading-network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    networks:
      - trading-network

  cassandra:
    image: cassandra:4.1
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=trading-cluster
      - CASSANDRA_PASSWORD=cassandra
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - trading-network

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=trading
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading-network

  # Security
  vault:
    image: vault:latest
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    volumes:
      - ./security/vault/vault-config.yml:/vault/config/vault.hcl
      - vault_data:/vault/data
    cap_add:
      - IPC_LOCK
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  elasticsearch_data:
  kibana_data:
  fluentd_data:
  postgres_data:
  cassandra_data:
  redis_data:
  vault_data:
