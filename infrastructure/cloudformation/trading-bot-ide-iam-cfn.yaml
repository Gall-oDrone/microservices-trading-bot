AWSTemplateFormatVersion: 2010-09-09
Description: IAM resources (role and instance profile) for the Trading Bot IDE environment.

Parameters:
  ParentStackName:
    Type: String
    Description: Base stack name used for naming IAM resources

Resources:
  TradingBotIdeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ParentStackName}-ide-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
                - ssm.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: ide-password
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:ListSecretVersionIds
                Resource: "*"
              - Effect: Allow
                Action: secretsmanager:ListSecrets
                Resource: "*"
        - PolicyName: ide-get-role
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:GetRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${ParentStackName}-ide-role
        - PolicyName: terraform-deployment-permissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # VPC and Networking Permissions
              - Effect: Allow
                Action:
                  - ec2:CreateVpc
                  - ec2:DeleteVpc
                  - ec2:DescribeVpcs
                  - ec2:DescribeVpcAttribute
                  - ec2:ModifyVpcAttribute
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                  - ec2:DescribeSubnets
                  - ec2:ModifySubnetAttribute
                  - ec2:CreateInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:DescribeInternetGateways
                  - ec2:CreateNatGateway
                  - ec2:DeleteNatGateway
                  - ec2:DescribeNatGateways
                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:DescribeRouteTables
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:DescribeRoutes
                  - ec2:ReplaceRoute
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:AllocateAddress
                  - ec2:ReleaseAddress
                  - ec2:DescribeAddresses
                  - ec2:AssociateAddress
                  - ec2:DisassociateAddress
                Resource: "*"
              # Security Groups
              - Effect: Allow
                Action:
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSecurityGroupRules
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:DescribeTags
                Resource: "*"
              # EC2 Instances and Launch Templates
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeInstanceAttribute
                  - ec2:DescribeImages
                  - ec2:DescribeAvailabilityZones
                  - ec2:CreateLaunchTemplate
                  - ec2:DeleteLaunchTemplate
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:CreateLaunchTemplateVersion
                  - ec2:DeleteLaunchTemplateVersion
                Resource: "*"
              # EKS Permissions
              - Effect: Allow
                Action:
                  - eks:CreateCluster
                  - eks:DeleteCluster
                  - eks:DescribeCluster
                  - eks:ListClusters
                  - eks:UpdateClusterConfig
                  - eks:UpdateClusterVersion
                  - eks:CreateNodegroup
                  - eks:DeleteNodegroup
                  - eks:DescribeNodegroup
                  - eks:ListNodegroups
                  - eks:UpdateNodegroupConfig
                  - eks:UpdateNodegroupVersion
                  - eks:ListAddons
                  - eks:DescribeAddon
                  - eks:CreateAddon
                  - eks:DeleteAddon
                  - eks:UpdateAddon
                  - eks:DescribeIdentityProviderConfig
                  - eks:ListIdentityProviderConfigs
                  - eks:AssociateIdentityProviderConfig
                  - eks:DisassociateIdentityProviderConfig
                Resource: "*"
              # ECR Permissions
              - Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DeleteRepository
                  - ecr:DescribeRepositories
                  - ecr:PutImageScanningConfiguration
                  - ecr:PutImageTagMutability
                  - ecr:SetRepositoryPolicy
                  - ecr:GetRepositoryPolicy
                  - ecr:PutLifecyclePolicy
                  - ecr:GetLifecyclePolicy
                  - ecr:DeleteLifecyclePolicy
                  - ecr:ListImages
                  - ecr:DescribeImages
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: "*"
              # MSK Permissions
              - Effect: Allow
                Action:
                  - kafka:CreateCluster
                  - kafka:DeleteCluster
                  - kafka:DescribeCluster
                  - kafka:ListClusters
                  - kafka:ListNodes
                  - kafka:UpdateBrokerCount
                  - kafka:UpdateBrokerStorage
                  - kafka:UpdateBrokerType
                  - kafka:GetBootstrapBrokers
                  - kafka:DescribeConfiguration
                  - kafka:DescribeConfigurationRevision
                  - kafka:ListConfigurationRevisions
                  - kafka:ListConfigurations
                  - kafka:CreateConfiguration
                  - kafka:DeleteConfiguration
                  - kafka:UpdateConfiguration
                  - kafka:UpdateConnectivity
                  - kafka:UpdateSecurity
                  - kafka:UpdateMonitoring
                  - kafka:UpdateStorage
                  - kafka:UpdateClusterConfiguration
                  - kafka:TagResource
                  - kafka:UntagResource
                  - kafka:ListTagsForResource
                Resource: "*"
              # ElastiCache/Redis Permissions
              - Effect: Allow
                Action:
                  - elasticache:CreateReplicationGroup
                  - elasticache:DeleteReplicationGroup
                  - elasticache:DescribeReplicationGroups
                  - elasticache:ModifyReplicationGroup
                  - elasticache:DescribeCacheSubnetGroups
                  - elasticache:CreateCacheSubnetGroup
                  - elasticache:DeleteCacheSubnetGroup
                  - elasticache:ModifyCacheSubnetGroup
                  - elasticache:DescribeCacheClusters
                  - elasticache:CreateCacheCluster
                  - elasticache:DeleteCacheCluster
                  - elasticache:ModifyCacheCluster
                  - elasticache:DescribeCacheParameterGroups
                  - elasticache:DescribeCacheParameters
                  - elasticache:CreateCacheParameterGroup
                  - elasticache:DeleteCacheParameterGroup
                  - elasticache:ModifyCacheParameterGroup
                  - elasticache:AddTagsToResource
                  - elasticache:RemoveTagsFromResource
                  - elasticache:ListTagsForResource
                Resource: "*"
              # IAM Permissions for Roles, Policies, and OIDC
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:ListRoles
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:CreateServiceLinkedRole
                  - iam:DeleteServiceLinkedRole
                  - iam:GetServiceLinkedRoleDeletionStatus
                  - iam:PassRole
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:ListInstanceProfilesForRole
                  - iam:CreateOpenIDConnectProvider
                  - iam:DeleteOpenIDConnectProvider
                  - iam:GetOpenIDConnectProvider
                  - iam:ListOpenIDConnectProviders
                  - iam:TagOpenIDConnectProvider
                  - iam:UntagOpenIDConnectProvider
                  - iam:ListOpenIDConnectProviderTags
                  - iam:GetPolicy
                  - iam:ListPolicies
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                Resource: "*"
              # Route53 Permissions (for External DNS and Cert Manager)
              - Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ListHostedZones
                  - route53:ListHostedZonesByName
                  - route53:ChangeResourceRecordSets
                  - route53:ListResourceRecordSets
                  - route53:GetChange
                  - route53:CreateHostedZone
                  - route53:DeleteHostedZone
                  - route53:UpdateHostedZoneComment
                  - route53:ListTagsForResource
                  - route53:ChangeTagsForResource
                Resource: "*"
              # Elastic Load Balancing (for ALB Controller)
              - Effect: Allow
                Action:
                  - elasticloadbalancing:CreateLoadBalancer
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeLoadBalancerAttributes
                  - elasticloadbalancing:ModifyLoadBalancerAttributes
                  - elasticloadbalancing:CreateTargetGroup
                  - elasticloadbalancing:DeleteTargetGroup
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetGroupAttributes
                  - elasticloadbalancing:ModifyTargetGroup
                  - elasticloadbalancing:ModifyTargetGroupAttributes
                  - elasticloadbalancing:RegisterTargets
                  - elasticloadbalancing:DeregisterTargets
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:CreateListener
                  - elasticloadbalancing:DeleteListener
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:ModifyListener
                  - elasticloadbalancing:AddTags
                  - elasticloadbalancing:RemoveTags
                  - elasticloadbalancing:DescribeTags
                  - elasticloadbalancing:AddListenerCertificates
                  - elasticloadbalancing:RemoveListenerCertificates
                  - elasticloadbalancing:DescribeListenerCertificates
                  - elasticloadbalancing:SetSecurityGroups
                  - elasticloadbalancing:SetSubnets
                Resource: "*"
              # Auto Scaling Permissions (for EKS Node Groups)
              - Effect: Allow
                Action:
                  - autoscaling:CreateAutoScalingGroup
                  - autoscaling:DeleteAutoScalingGroup
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:UpdateAutoScalingGroup
                  - autoscaling:DescribeScalingActivities
                  - autoscaling:CreateLaunchConfiguration
                  - autoscaling:DeleteLaunchConfiguration
                  - autoscaling:DescribeLaunchConfigurations
                  - autoscaling:CreateOrUpdateTags
                  - autoscaling:DeleteTags
                  - autoscaling:DescribeTags
                  - autoscaling:SetDesiredCapacity
                  - autoscaling:TerminateInstanceInAutoScalingGroup
                  - autoscaling:DescribeAutoScalingInstances
                Resource: "*"
              # Secrets Manager and SSM Permissions (for External Secrets)
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecret
                  - secretsmanager:ListSecrets
                  - secretsmanager:ListSecretVersionIds
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:PutResourcePolicy
                  - secretsmanager:DeleteResourcePolicy
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                  - secretsmanager:ListTagsForResource
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:DescribeParameters
                  - ssm:GetParameterHistory
                  - ssm:LabelParameterVersion
                  - ssm:AddTagsToResource
                  - ssm:RemoveTagsFromResource
                  - ssm:ListTagsForResource
                Resource: "*"
              # CloudWatch Logs (for various services)
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:CreateLogStream
                  - logs:DeleteLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                  - logs:TagLogGroup
                  - logs:UntagLogGroup
                  - logs:ListTagsLogGroup
                Resource: "*"
              # EventBridge/CloudWatch Events (for EKS)
              - Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:ListRules
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:ListTargetsByRule
                  - events:EnableRule
                  - events:DisableRule
                  - events:TagResource
                  - events:UntagResource
                  - events:ListTagsForResource
                Resource: "*"
              # ACM (Certificate Manager) Permissions
              - Effect: Allow
                Action:
                  - acm:RequestCertificate
                  - acm:DeleteCertificate
                  - acm:DescribeCertificate
                  - acm:ListCertificates
                  - acm:AddTagsToCertificate
                  - acm:RemoveTagsFromCertificate
                  - acm:ListTagsForCertificate
                Resource: "*"
              # Service Quotas (for checking limits)
              - Effect: Allow
                Action:
                  - servicequotas:GetServiceQuota
                  - servicequotas:ListServiceQuotas
                  - servicequotas:GetAWSDefaultServiceQuota
                  - servicequotas:ListAWSDefaultServiceQuotas
                Resource: "*"
              # STS (for getting account info)
              - Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                  - sts:GetSessionToken
                Resource: "*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Path: "/"
  TradingBotIdeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${ParentStackName}-ide-instance-profile
      Path: "/"
      Roles:
        - !Ref TradingBotIdeRole

Outputs:
  RoleArn:
    Description: IAM role ARN for the IDE instance
    Value: !GetAtt TradingBotIdeRole.Arn
  RoleName:
    Description: IAM role name for the IDE instance
    Value: !Ref TradingBotIdeRole
  InstanceProfileName:
    Description: Instance profile name for the IDE instance
    Value: !Ref TradingBotIdeInstanceProfile
  InstanceProfileArn:
    Description: Instance profile ARN for the IDE instance
    Value: !GetAtt TradingBotIdeInstanceProfile.Arn

