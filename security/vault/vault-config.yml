apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: bitso-trading-platform
data:
  vault.hcl: |
    storage "file" {
      path = "/vault/file"
    }
    
    listener "tcp" {
      address = "0.0.0.0:8200"
      tls_disable = 1
    }
    
    api_addr = "http://0.0.0.0:8200"
    cluster_addr = "https://0.0.0.0:8201"
    
    ui = true
    
    # Enable audit logging
    audit_device "file" {
      path = "/vault/audit/audit.log"
    }
    
    # Enable metrics
    telemetry {
      prometheus_retention_time = "30s"
      disable_hostname = true
    }
