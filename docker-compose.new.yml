version: '3.8'

services:
  # Trading Engine Service
  trading-engine:
    build:
      context: ./services/trading-engine
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVICE_NAME=trading-engine
      - LOG_LEVEL=info
    depends_on:
      - kafka
      - redis
    networks:
      - trading-network

  # Backtesting Service
  backtesting:
    build:
      context: ./services/backtesting
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SERVICE_NAME=backtesting
      - LOG_LEVEL=info
    depends_on:
      - kafka
      - redis
    networks:
      - trading-network

  # Strategy Executor Service
  strategy-executor:
    build:
      context: ./services/strategy-executor
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SERVICE_NAME=strategy-executor
      - LOG_LEVEL=info
    depends_on:
      - kafka
      - redis
    networks:
      - trading-network

  # Market Data Service
  market-data:
    build:
      context: ./services/market-data
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - SERVICE_NAME=market-data
      - LOG_LEVEL=info
    depends_on:
      - kafka
      - redis
    networks:
      - trading-network

  # Order Management Service
  order-management:
    build:
      context: ./services/order-management
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      - SERVICE_NAME=order-management
      - LOG_LEVEL=info
    depends_on:
      - kafka
      - redis
    networks:
      - trading-network

  # API Gateway Service
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - SERVICE_NAME=api-gateway
      - LOG_LEVEL=info
    depends_on:
      - trading-engine
      - backtesting
      - strategy-executor
      - market-data
      - order-management
    networks:
      - trading-network

  # Infrastructure Services
  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - trading-network

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - trading-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    networks:
      - trading-network

  cassandra:
    image: cassandra:4.1
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=trading-cluster
      - CASSANDRA_PASSWORD=cassandra
    networks:
      - trading-network

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=trading
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge

volumes:
  postgres_data:
  cassandra_data:
  redis_data:
