<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Operator console for the trading bot: SMA50 forward tests, stage execution costs and execution risk limits."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2321a38c'/%3E%3Cpath d='M4 16l5-5 3.5 3.5L20 7' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Trading Bot Console</title>
    <script>
      // Apply the saved theme before first paint (dark is the default). Kept in sync with src/lib/theme.ts.
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.style.colorScheme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f7fa')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
