name: Build and Push to ECR

on:
  push:
    branches: [ main, staging, feat/eks-infrastructure-baseline, feat/k8s-deployment-manifests ]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ECR_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  IMAGE_PREFIX: microservices-trading-bot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        service: [trading-engine, backtesting, strategy-executor, market-data, order-management, api-gateway]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: ecr-login
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set image vars
      id: vars
      run: |
        REPO=${{ matrix.service }}
        ECR_REGISTRY="${{ env.ECR_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
        echo "repo=${REPO}" >> $GITHUB_OUTPUT
        echo "image=${ECR_REGISTRY}/${REPO}" >> $GITHUB_OUTPUT

    - name: Ensure ECR repo exists (no-op if present)
      run: |
        aws ecr describe-repositories --repository-names "${{ steps.vars.outputs.repo }}" >/dev/null 2>&1 || \
        aws ecr create-repository --repository-name "${{ steps.vars.outputs.repo }}" >/dev/null

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./services/${{ matrix.service }}/Dockerfile
        push: true
        tags: |
          ${{ steps.vars.outputs.image }}:${{ github.sha }}
          ${{ steps.vars.outputs.image }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
