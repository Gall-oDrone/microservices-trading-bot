# promtool unit tests for ../rules/trading-slo-rules.yml (generated by scripts/gen-slo.py).
# Run: promtool test rules monitoring/prometheus/tests/trading-slo-rules.test.yml
# (Kept outside rules/ so Prometheus' rules/*.yml glob does not load it.)

rule_files:
  - ../rules/trading-slo-rules.yml

evaluation_interval: 1m

tests:
  # A time SLI that fails continuously: market data stale for 90 minutes.
  # error ratio 1 over every window, burn 1/(1-0.995) = 200x -> the fast page fires
  # (critical, for 2m), the slow ones too once their windows are full of failure;
  # the event-kind alerts never fire on a time SLI.
  - interval: 1m
    input_series:
      - series: 'market_data_last_trade_age_seconds{job="market-data",instance="md-0"}'
        values: '500+0x90'
    promql_expr_test:
      - expr: slo:good:bool{slo="market_data_freshness"}
        eval_time: 10m
        exp_samples:
          - labels: 'slo:good:bool{slo="market_data_freshness",team="trading",kind="time"}'
            value: 0
      - expr: round(slo:burn_rate:1h{slo="market_data_freshness"}, 0.01)
        eval_time: 70m
        exp_samples:
          - labels: '{slo="market_data_freshness",team="trading",kind="time"}'
            value: 200
    alert_rule_test:
      - eval_time: 70m
        alertname: TradingSLOBurnFast1H
        exp_alerts:
          - exp_labels: {severity: critical, team: trading, slo: market_data_freshness, kind: time}
            exp_annotations:
              summary: "SLO market_data_freshness: burn rate 200.0x over 1h (and 5m)"
              description: "Error budget burning at 14.4x over 1h and 5m: 2 % of the 30-day budget in 1 h. The runbook lists the SLI's source metrics and the per-event alerts to read next."
              runbook_url: "docs/runbooks/TRADING-SLO.md#tradingsloburnfast1h"
      - eval_time: 70m
        alertname: TradingSLOBurnSlow6HEvents
        exp_alerts: []

  # A healthy time SLI: the condition holds throughout -> SLI 1, budget 1, burn 0.
  - interval: 1m
    input_series:
      - series: 'market_data_last_trade_age_seconds{job="market-data",instance="md-0"}'
        values: '3+0x90'
    promql_expr_test:
      - expr: slo:sli:30d{slo="market_data_freshness"}
        eval_time: 60m
        exp_samples:
          - labels: 'slo:sli:30d{slo="market_data_freshness",team="trading",kind="time"}'
            value: 1
      - expr: slo:budget_remaining:30d{slo="market_data_freshness"}
        eval_time: 60m
        exp_samples:
          - labels: 'slo:budget_remaining:30d{slo="market_data_freshness",team="trading",kind="time"}'
            value: 1
    alert_rule_test:
      - eval_time: 80m
        alertname: TradingSLOBurnFast1H
        exp_alerts: []

  # An event SLI at this platform's real volume: six slow decisions in six hours
  # (one an hour), every one of them over 5 s. The error ratio is 1 and the burn
  # rate 100x, but six events are under the 6h guard of 10, so nothing fires.
  - interval: 1m
    input_series:
      - series: 'signal_to_order_latency_seconds_bucket{job="trading-engine",le="5"}'
        values: '0+0x420'
      - series: 'signal_to_order_latency_seconds_count{job="trading-engine"}'
        values: '0x60 1x60 2x60 3x60 4x60 5x60 6x60'
    promql_expr_test:
      - expr: slo:error_ratio:6h{slo="tick_to_trade"}
        eval_time: 400m
        exp_samples:
          - labels: 'slo:error_ratio:6h{slo="tick_to_trade",team="trading",kind="event"}'
            value: 1
      - expr: slo:events:6h{slo="tick_to_trade"} < on (slo) slo:min_events:6h
        eval_time: 400m
        exp_samples:
          - labels: '{slo="tick_to_trade"}'
            value: 6
    alert_rule_test:
      - eval_time: 400m
        alertname: TradingSLOBurnSlow6HEvents
        exp_alerts: []
      - eval_time: 400m
        alertname: TradingSLOBurnFast6H
        exp_alerts: []

  # The same SLI with volume: one decision a minute, all slow -> 360 events in 6h,
  # the guard is met and the 6h/30m warning fires (for 15m); the critical pair is
  # reserved for time SLIs and stays silent.
  - interval: 1m
    input_series:
      - series: 'signal_to_order_latency_seconds_bucket{job="trading-engine",le="5"}'
        values: '0+0x420'
      - series: 'signal_to_order_latency_seconds_count{job="trading-engine"}'
        values: '0+1x420'
    alert_rule_test:
      - eval_time: 400m
        alertname: TradingSLOBurnSlow6HEvents
        exp_alerts:
          - exp_labels: {severity: warning, team: trading, slo: tick_to_trade, kind: event}
            exp_annotations:
              summary: "SLO tick_to_trade: burn rate 100.0x over 6h (and 30m)"
              description: "Error budget burning at 6x over 6h and 30m: 5 % of the 30-day budget in 6 h. Low-volume platform: this only fires with enough events in the window (slo:min_events). The runbook lists the SLI's source metrics and the per-event alerts to read next."
              runbook_url: "docs/runbooks/TRADING-SLO.md#tradingsloburnslow6hevents"
      - eval_time: 400m
        alertname: TradingSLOBurnFast6H
        exp_alerts: []

  # Order acceptance excludes risk rejections: 20 orders, 4 rejected by the risk
  # check and 1 by validation -> 19/20 good, error ratio 0.05 (target 0.95, so
  # burn exactly 1x), budget remaining 0 after 30 d of this.
  - interval: 1m
    input_series:
      - series: 'orders_created_total{job="order-management",book="btc_mxn",strategy="s"}'
        values: '0+1x60'
      - series: 'orders_rejected_total{job="order-management",book="btc_mxn",strategy="s",reason="risk_check_failed"}'
        values: '0+0.2x60'
      - series: 'orders_rejected_total{job="order-management",book="btc_mxn",strategy="s",reason="validation_failed"}'
        values: '0+0.05x60'
    promql_expr_test:
      - expr: round(slo:error_ratio:1h{slo="order_acceptance"}, 0.001)
        eval_time: 60m
        exp_samples:
          - labels: '{slo="order_acceptance",team="trading",kind="event"}'
            value: 0.05
      - expr: round(slo:burn_rate:1h{slo="order_acceptance"}, 0.01)
        eval_time: 60m
        exp_samples:
          - labels: '{slo="order_acceptance",team="trading",kind="event"}'
            value: 1
