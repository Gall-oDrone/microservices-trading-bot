# promtool unit tests for ../rules/trading-risk-alerts.yml.
# Run: promtool test rules monitoring/prometheus/tests/trading-risk-alerts.test.yml
# (Kept outside rules/ so Prometheus' rules/*.yml glob does not load it.)

rule_files:
  - ../rules/trading-risk-alerts.yml

evaluation_interval: 1m

tests:
  # Kill switch engaged by the operator: warning, immediately; no invalid-file page.
  - interval: 1m
    input_series:
      - series: 'trading_halt_active{job="trading-engine",instance="te-0"}'
        values: '0 1 1 1'
      - series: 'trading_halt_files_invalid{job="trading-engine",instance="te-0"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 0m
        alertname: TradingKillSwitchEngaged
        exp_alerts: []
      - eval_time: 1m
        alertname: TradingKillSwitchEngaged
        exp_alerts:
          - exp_labels: {severity: warning, team: risk, job: trading-engine, instance: te-0}
            exp_annotations:
              summary: "Trading halted on te-0: new orders are blocked"
              description: "A halt file is halted, unreadable or invalid. Expected after HALT ALL; otherwise check risk-state.json and the ui-api audit log."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradingkillswitchengaged"
      - eval_time: 3m
        alertname: TradingHaltFileInvalid
        exp_alerts: []

  # A corrupt halt file pages after 1m.
  - interval: 1m
    input_series:
      - series: 'trading_halt_files_invalid{job="trading-engine",instance="te-0"}'
        values: '1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: TradingHaltFileInvalid
        exp_alerts:
          - exp_labels: {severity: critical, team: risk, job: trading-engine, instance: te-0}
            exp_annotations:
              summary: "1 halt file(s) cannot be read on te-0"
              description: "Every order is blocked (fail closed) until the file is fixed or removed. Nobody chose this halt."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradinghaltfileinvalid"

  # No halt files: page only when live, not in dry run.
  - interval: 1m
    input_series:
      - series: 'trading_halt_files_configured{job="trading-engine",instance="live"}'
        values: '0x10'
      - series: 'trading_engine_dry_run{job="trading-engine",instance="live"}'
        values: '0x10'
      - series: 'trading_halt_files_configured{job="trading-engine",instance="dry"}'
        values: '0x10'
      - series: 'trading_engine_dry_run{job="trading-engine",instance="dry"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: TradingKillSwitchUnreachable
        exp_alerts:
          - exp_labels: {severity: critical, team: risk, job: trading-engine, instance: live}
            exp_annotations:
              summary: "Live trading-engine live watches no halt files"
              description: "TRADING_HALT_FILES is empty, so HALT ALL cannot stop this engine. Set it or stop the engine."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradingkillswitchunreachable"

  # Session limits: warning at 80 %, critical at 100 %, never both.
  - interval: 1m
    input_series:
      - series: 'trading_session_limit_utilization_ratio{job="trading-engine",instance="te-0",limit="max_daily_loss"}'
        values: '0.5 0.85 1.0'
    alert_rule_test:
      - eval_time: 0m
        alertname: TradingSessionLimitWarning
        exp_alerts: []
      - eval_time: 1m
        alertname: TradingSessionLimitWarning
        exp_alerts:
          - exp_labels: {severity: warning, team: risk, job: trading-engine, limit: max_daily_loss}
            exp_annotations:
              summary: "max_daily_loss at 85% of its limit"
              description: "Session loss or drawdown is past 80 % of the limit. New orders stop at 100 %."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradingsessionlimitwarning"
      - eval_time: 2m
        alertname: TradingSessionLimitWarning
        exp_alerts: []
      - eval_time: 2m
        alertname: TradingSessionLimitBreached
        exp_alerts:
          - exp_labels: {severity: critical, team: risk, job: trading-engine, limit: max_daily_loss}
            exp_annotations:
              summary: "max_daily_loss breached (100%): new orders are blocked"
              description: "Session limit hit. Orders stay blocked for the rest of the session; open positions are not flattened automatically."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradingsessionlimitbreached"

  # A hard-limit block is a breach attempt; halts and fail-closed blocks are not.
  - interval: 1m
    input_series:
      - series: 'pretrade_policy_rejections_total{job="trading-engine",instance="te-0",book="btc_mxn",rule="max_order_btc"}'
        values: '0 0 1 1'
      - series: 'pretrade_policy_rejections_total{job="trading-engine",instance="te-0",book="btc_mxn",rule="halted"}'
        values: '0 5 10 15'
    alert_rule_test:
      - eval_time: 3m
        alertname: TradingLimitBreachAttempt
        exp_alerts:
          - exp_labels: {severity: warning, team: risk, job: trading-engine, book: btc_mxn, rule: max_order_btc}
            exp_annotations:
              summary: "btc_mxn: 1 order(s) blocked by max_order_btc in 15m"
              description: "A strategy tried to exceed a hard limit. Every breach attempt is reviewed (who, which strategy, why)."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradinglimitbreachattempt"

  # Reconciliation: stale sync pages; a never-run sync (gauge 0) does not.
  - interval: 1m
    input_series:
      - series: 'bitso_sync_last_success_timestamp_seconds{job="order-management",instance="om-0"}'
        values: '60x20'
      - series: 'bitso_sync_last_success_timestamp_seconds{job="order-management",instance="om-off"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: OrderExchangeSyncStale
        exp_alerts:
          - exp_labels: {severity: critical, team: trading, job: order-management, instance: om-0}
            exp_annotations:
              summary: "Order status not reconciled with Bitso for 11m 0s"
              description: "OMS and exchange may disagree on open orders and fills (reconciliation break risk)."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#orderexchangesyncstale"

  # §6.4.7 realized slippage: btc_mxn at 80 bps (adverse a constant share of
  # notional, so increase() extrapolation cancels in the ratio) fires;
  # btc_usd at 20 bps does not.
  - interval: 1h
    input_series:
      - series: 'order_filled_notional_quote_total{job="order-management",instance="om-0",book="btc_mxn",side="buy"}'
        values: '0 1000 2000 3000 4000 5000 6000'
      - series: 'order_slippage_cost_quote_total{job="order-management",instance="om-0",book="btc_mxn",side="buy",direction="adverse"}'
        values: '0 8 16 24 32 40 48'
      - series: 'order_slippage_cost_quote_total{job="order-management",instance="om-0",book="btc_mxn",side="buy",direction="improvement"}'
        values: '0 0 0 0 0 0 0'
      - series: 'order_filled_notional_quote_total{job="order-management",instance="om-0",book="btc_usd",side="buy"}'
        values: '0 1000 2000 3000 4000 5000 6000'
      - series: 'order_slippage_cost_quote_total{job="order-management",instance="om-0",book="btc_usd",side="buy",direction="adverse"}'
        values: '0 2 4 6 8 10 12'
      - series: 'order_slippage_cost_quote_total{job="order-management",instance="om-0",book="btc_usd",side="buy",direction="improvement"}'
        values: '0 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 6h
        alertname: OrderSlippageHigh
        exp_alerts:
          - exp_labels: {severity: warning, team: trading, job: order-management, book: btc_mxn}
            exp_annotations:
              summary: "btc_mxn realized slippage 80 bps vs decision price (notional-weighted, 6h)"
              description: "Fills are well away from the price the strategy decided on, before fees. The pre-registered cost budget assumes far less; check order type, resting time and liquidity."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#orderslippagehigh"

  # VaR at 85 % of the MXN limit: warning after 5m. USD has no limit: no alert.
  - interval: 1m
    input_series:
      - series: 'portfolio_var_quote{job="order-management",instance="om-0",currency="MXN"}'
        values: '17000x10'
      - series: 'portfolio_var_limit_quote{job="order-management",instance="om-0",currency="MXN"}'
        values: '20000x10'
      - series: 'portfolio_var_quote{job="order-management",instance="om-0",currency="USD"}'
        values: '900000x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: PortfolioVaRLimitWarning
        exp_alerts: []
      - eval_time: 5m
        alertname: PortfolioVaRLimitWarning
        exp_alerts:
          - exp_labels: {severity: warning, team: risk, job: order-management, currency: MXN}
            exp_annotations:
              summary: "MXN 1-day 99% VaR at 85% of its limit"
              description: "Exposure is approaching the VaR limit. Nothing is blocked automatically; the desk decides whether to reduce."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#portfoliovarlimitwarning"
      - eval_time: 5m
        alertname: PortfolioVaRLimitBreached
        exp_alerts: []

  # VaR above the limit: critical after 1m.
  - interval: 1m
    input_series:
      - series: 'portfolio_var_quote{job="order-management",instance="om-0",currency="MXN"}'
        values: '21000x5'
      - series: 'portfolio_var_limit_quote{job="order-management",instance="om-0",currency="MXN"}'
        values: '20000x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: PortfolioVaRLimitBreached
        exp_alerts:
          - exp_labels: {severity: critical, team: risk, job: order-management, currency: MXN}
            exp_annotations:
              summary: "MXN 1-day 99% VaR at 105% of its limit"
              description: "VaR limit breached: escalate to the risk owner, reduce exposure or halt (scripts/k8s-halt.sh)."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#portfoliovarlimitbreached"

  # Portfolio monitor stopped after its run at t=60s; an open book without a
  # market price.
  - interval: 1m
    input_series:
      - series: 'portfolio_risk_last_run_timestamp_seconds{job="order-management",instance="om-0"}'
        values: '60x15'
      - series: 'position_mark_fallback{job="order-management",instance="om-0",book="btc_usd"}'
        values: '1x15'
      - series: 'position_mark_fallback{job="order-management",instance="om-0",book="btc_mxn"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: PortfolioRiskStale
        exp_alerts: []
      - eval_time: 12m
        alertname: PortfolioRiskStale
        exp_alerts:
          - exp_labels: {severity: warning, team: risk, job: order-management, instance: om-0}
            exp_annotations:
              summary: "Portfolio exposure and VaR not computed for 11m 0s"
              description: "The monitor cannot read positions (see portfolio_risk_run_errors_total); exposure and VaR gauges are frozen."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#portfolioriskstale"
      - eval_time: 10m
        alertname: PositionUnpriced
        exp_alerts:
          - exp_labels: {severity: warning, team: risk, job: order-management, book: btc_usd}
            exp_annotations:
              summary: "btc_usd has an open position but no market price"
              description: "Marked at the entry price (or 0): its exposure and VaR are stale. Check market-data's ticker and MARKET_DATA_URL."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#positionunpriced"

  # VaR model (plan §6.4.8): btc_mxn backtest yellow, btc_usd red, eth_mxn
  # green; btc_usd's vol on the configured fallback, btc_mxn estimated.
  - interval: 1m
    input_series:
      - series: 'risk_var_backtest_zone{job="order-management",instance="om-0",book="btc_mxn"}'
        values: '1x70'
      - series: 'risk_var_backtest_zone{job="order-management",instance="om-0",book="btc_usd"}'
        values: '2x70'
      - series: 'risk_var_backtest_zone{job="order-management",instance="om-0",book="eth_mxn"}'
        values: '0x70'
      - series: 'risk_var_vol_source{job="order-management",instance="om-0",book="btc_usd",source="fallback"}'
        values: '1x70'
      - series: 'risk_var_vol_source{job="order-management",instance="om-0",book="btc_mxn",source="fallback"}'
        values: '0x70'
      - series: 'risk_var_vol_source{job="order-management",instance="om-0",book="btc_mxn",source="estimated"}'
        values: '1x70'
    alert_rule_test:
      - eval_time: 59m
        alertname: VaRBacktestYellow
        exp_alerts: []
      - eval_time: 60m
        alertname: VaRBacktestYellow
        exp_alerts:
          - exp_labels: {severity: warning, team: risk, job: order-management, book: btc_mxn}
            exp_annotations:
              summary: "btc_mxn VaR backtest in the Basel yellow zone (5-9 exceptions in 250 days)"
              description: "Losses beyond the 99% VaR are more frequent than 1 in 100 days. Review the model (risk_var_backtest_exceptions, risk_var_backtest_kupiec_pvalue) before relying on the VaR number."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#varbacktestyellow"
      - eval_time: 14m
        alertname: VaRBacktestRed
        exp_alerts: []
      - eval_time: 15m
        alertname: VaRBacktestRed
        exp_alerts:
          - exp_labels: {severity: critical, team: risk, job: order-management, book: btc_usd}
            exp_annotations:
              summary: "btc_usd VaR backtest in the Basel red zone (10+ exceptions in 250 days)"
              description: "The VaR model understates this book's risk. Treat the VaR and its limit as unreliable until the model is fixed; escalate to the risk owner."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#varbacktestred"
      - eval_time: 29m
        alertname: VaRVolEstimateFallback
        exp_alerts: []
      - eval_time: 30m
        alertname: VaRVolEstimateFallback
        exp_alerts:
          - exp_labels: {severity: warning, team: risk, job: order-management, book: btc_usd}
            exp_annotations:
              summary: "btc_usd VaR uses the configured vol, not an estimate"
              description: "No fresh estimate from Bitso daily closes (fetch failing, no egress to api.bitso.com, or closes older than RISK_VAR_VOL_STALE). The VaR uses RISK_VAR_DAILY_VOL until it recovers."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#varvolestimatefallback"

  # Historical VaR 1.8x the parametric one in MXN, 1.2x in USD; EUR has a
  # historical VaR but zero parametric VaR (flat): no division by zero.
  - interval: 1m
    input_series:
      - series: 'portfolio_var_historical_quote{job="order-management",instance="om-0",currency="MXN"}'
        values: '9000x70'
      - series: 'portfolio_var_quote{job="order-management",instance="om-0",currency="MXN"}'
        values: '5000x70'
      - series: 'portfolio_var_historical_quote{job="order-management",instance="om-0",currency="USD"}'
        values: '60x70'
      - series: 'portfolio_var_quote{job="order-management",instance="om-0",currency="USD"}'
        values: '50x70'
      - series: 'portfolio_var_historical_quote{job="order-management",instance="om-0",currency="EUR"}'
        values: '0x70'
      - series: 'portfolio_var_quote{job="order-management",instance="om-0",currency="EUR"}'
        values: '0x70'
    alert_rule_test:
      - eval_time: 59m
        alertname: PortfolioVaRModelDivergence
        exp_alerts: []
      - eval_time: 60m
        alertname: PortfolioVaRModelDivergence
        exp_alerts:
          - exp_labels: {severity: warning, team: risk, job: order-management, currency: MXN}
            exp_annotations:
              summary: "MXN historical-simulation VaR is 1.8x the parametric VaR"
              description: "The last year's actual returns imply a much larger 99% loss than the normal model. The limit applies to the parametric VaR; the desk should judge exposure on the larger number."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#portfoliovarmodeldivergence"

  # Stress (plan §6.4.9): MXN worst stress loss 50k against a 40k limit;
  # USD has no stress limit. One MXN historical scenario stays incomplete.
  - interval: 1m
    input_series:
      - series: 'portfolio_stress_worst_loss_quote{job="order-management",instance="om-0",currency="MXN"}'
        values: '50000x150'
      - series: 'portfolio_stress_limit_quote{job="order-management",instance="om-0",currency="MXN"}'
        values: '40000x150'
      - series: 'portfolio_stress_worst_loss_quote{job="order-management",instance="om-0",currency="USD"}'
        values: '600x150'
      - series: 'portfolio_stress_incomplete{job="order-management",instance="om-0",currency="MXN",scenario="2018-01-crash"}'
        values: '1x150'
      - series: 'portfolio_stress_incomplete{job="order-management",instance="om-0",currency="MXN",scenario="2020-03-covid"}'
        values: '0x150'
    alert_rule_test:
      - eval_time: 14m
        alertname: PortfolioStressLimitBreached
        exp_alerts: []
      - eval_time: 15m
        alertname: PortfolioStressLimitBreached
        exp_alerts:
          - exp_labels: {severity: warning, team: risk, job: order-management, currency: MXN}
            exp_annotations:
              summary: "MXN worst stress loss at 125% of its stress limit"
              description: "In at least one stress scenario today's exposure would lose more than RISK_STRESS_LIMITS allows (see portfolio_stress_loss_quote by scenario). Nothing is blocked; the risk owner decides whether to reduce."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#portfoliostresslimitbreached"
      - eval_time: 119m
        alertname: PortfolioStressScenarioIncomplete
        exp_alerts: []
      - eval_time: 120m
        alertname: PortfolioStressScenarioIncomplete
        exp_alerts:
          - exp_labels: {severity: warning, team: risk, job: order-management, currency: MXN, scenario: 2018-01-crash}
            exp_annotations:
              summary: "MXN stress scenario 2018-01-crash cannot be computed"
              description: "An exposed book has no Bitso closes for the episode and no book on the same asset does (or the episode fetch keeps failing). The worst stress loss omits this scenario."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#portfoliostressscenarioincomplete"

  # Capital (plan §6.4.10): MXN's worst stress loss is 124 % of capital;
  # USD's is 40 %.
  - interval: 1m
    input_series:
      - series: 'portfolio_risk_capital_ratio{job="order-management",instance="om-0",currency="MXN",measure="stress_worst"}'
        values: '1.24x30'
      - series: 'portfolio_risk_capital_ratio{job="order-management",instance="om-0",currency="MXN",measure="var_parametric"}'
        values: '0.09x30'
      - series: 'portfolio_risk_capital_ratio{job="order-management",instance="om-0",currency="USD",measure="stress_worst"}'
        values: '0.4x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: PortfolioStressExceedsCapital
        exp_alerts: []
      - eval_time: 15m
        alertname: PortfolioStressExceedsCapital
        exp_alerts:
          - exp_labels: {severity: warning, team: risk, job: order-management, currency: MXN}
            exp_annotations:
              summary: "MXN worst stress loss is 124% of risk capital"
              description: "A stress scenario on today's exposure would lose all of RISK_CAPITAL (portfolio_reverse_stress_move_ratio is the spot move that does it). Nothing is blocked; the risk owner decides whether to reduce or add capital."
              runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#portfoliostressexceedscapital"
