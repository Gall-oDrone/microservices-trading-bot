# Trading-risk operations alerts (plan §6.4.4, runbook docs/runbooks/TRADING-RISK-ALERTS.md).
#
# Modelled on what a hedge fund / private bank risk desk pages on: the kill
# switch and whether it can reach the engine, limit breaches and limit
# utilization (warn at 80 %, page at 100 %), fail-closed blocks, execution
# quality (price vs mid, signal staleness, tick-to-trade) and OMS-exchange
# reconciliation. Severity: critical = page now, warning = review the same
# trading day, info = record only.
#
# Kept in sync with k8s/monitoring/trading-risk-rules.yaml (PrometheusRule);
# CI (operator-ui.yml, job monitoring-rules) runs promtool on both copies,
# the unit tests in trading-risk-alerts.test.yml, and checks they match.

groups:
  - name: trading-risk-controls
    rules:
      # --- Kill switch ---
      - alert: TradingKillSwitchEngaged
        expr: max by (job, instance) (trading_halt_active{job=~"trading-engine.*"}) == 1
        labels:
          severity: warning
          team: risk
        annotations:
          summary: "Trading halted on {{ $labels.instance }}: new orders are blocked"
          description: "A halt file is halted, unreadable or invalid. Expected after HALT ALL; otherwise check risk-state.json and the ui-api audit log."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradingkillswitchengaged"

      - alert: TradingHaltFileInvalid
        expr: max by (job, instance) (trading_halt_files_invalid{job=~"trading-engine.*"}) > 0
        for: 1m
        labels:
          severity: critical
          team: risk
        annotations:
          summary: "{{ $value }} halt file(s) cannot be read on {{ $labels.instance }}"
          description: "Every order is blocked (fail closed) until the file is fixed or removed. Nobody chose this halt."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradinghaltfileinvalid"

      - alert: TradingKillSwitchUnreachable
        expr: |
          trading_halt_files_configured{job=~"trading-engine.*"} == 0
          and on (job, instance) trading_engine_dry_run{job=~"trading-engine.*"} == 0
        for: 5m
        labels:
          severity: critical
          team: risk
        annotations:
          summary: "Live trading-engine {{ $labels.instance }} watches no halt files"
          description: "TRADING_HALT_FILES is empty, so HALT ALL cannot stop this engine. Set it or stop the engine."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradingkillswitchunreachable"

      - alert: TradingHaltWatcherStale
        expr: time() - trading_halt_last_check_timestamp_seconds{job=~"trading-engine.*"} > 60
        for: 2m
        labels:
          severity: warning
          team: risk
        annotations:
          summary: "Halt files not evaluated for {{ $value | humanizeDuration }} on {{ $labels.instance }}"
          description: "The kill-switch gauge is stale. Per-order checks still read the files, but the dashboard cannot be trusted."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradinghaltwatcherstale"

      # --- Policy ---
      - alert: TradingRiskPolicyVersionDrift
        expr: count(count by (version) (trading_risk_policy_info{job=~"trading-engine.*"})) > 1
        for: 10m
        labels:
          severity: warning
          team: risk
        annotations:
          summary: "{{ $value }} risk policy versions are live at once"
          description: "Replicas enforce different limits. Roll out one TRADING_RISK_POLICY file."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradingriskpolicyversiondrift"

      - alert: TradingRiskStateUnknown
        expr: sum by (job, book) (increase(pretrade_policy_checks_total{job=~"trading-engine.*",result="error"}[5m])) > 0
        labels:
          severity: critical
          team: risk
        annotations:
          summary: "Orders blocked on {{ $labels.book }}: position or halt state unknown"
          description: "The gate failed closed {{ $value }} time(s) in 5m (order-management exposure unreachable or a bad halt file)."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradingriskstateunknown"

      # --- Limit breaches and utilization ---
      - alert: TradingLimitBreachAttempt
        expr: sum by (job, book, rule) (increase(pretrade_policy_rejections_total{job=~"trading-engine.*",rule!~"halted|position_unknown"}[15m])) > 0
        labels:
          severity: warning
          team: risk
        annotations:
          summary: "{{ $labels.book }}: {{ $value }} order(s) blocked by {{ $labels.rule }} in 15m"
          description: "A strategy tried to exceed a hard limit. Every breach attempt is reviewed (who, which strategy, why)."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradinglimitbreachattempt"

      - alert: TradingOrderLimitUtilizationHigh
        expr: |
          histogram_quantile(0.95,
            sum by (job, book, limit, le) (rate(order_limit_utilization_ratio_bucket{job=~"trading-engine.*"}[1h]))
          ) > 0.9
        for: 15m
        labels:
          severity: warning
          team: risk
        annotations:
          summary: "{{ $labels.book }} orders run at {{ $value | humanizePercentage }} of {{ $labels.limit }} (p95, 1h)"
          description: "Orders sit close to the per-order limit: either size down or review the limit."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradingorderlimitutilizationhigh"

      - alert: TradingSessionLimitWarning
        expr: |
          max by (job, limit) (trading_session_limit_utilization_ratio{job=~"trading-engine.*"}) >= 0.8
          and max by (job, limit) (trading_session_limit_utilization_ratio{job=~"trading-engine.*"}) < 1
        labels:
          severity: warning
          team: risk
        annotations:
          summary: "{{ $labels.limit }} at {{ $value | humanizePercentage }} of its limit"
          description: "Session loss or drawdown is past 80 % of the limit. New orders stop at 100 %."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradingsessionlimitwarning"

      - alert: TradingSessionLimitBreached
        expr: max by (job, limit) (trading_session_limit_utilization_ratio{job=~"trading-engine.*"}) >= 1
        labels:
          severity: critical
          team: risk
        annotations:
          summary: "{{ $labels.limit }} breached ({{ $value | humanizePercentage }}): new orders are blocked"
          description: "Session limit hit. Orders stay blocked for the rest of the session; open positions are not flattened automatically."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradingsessionlimitbreached"

  - name: trading-execution-quality
    rules:
      - alert: TradingPriceDeviationHigh
        expr: |
          histogram_quantile(0.95,
            sum by (job, book, le) (rate(order_price_deviation_bps_bucket{job=~"trading-engine.*"}[30m]))
          ) > 100
        for: 15m
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "{{ $labels.book }} orders priced {{ $value }} bps from mid (p95, 30m)"
          description: "Arrival-price slippage proxy. Check spread, stale signals and the strategy's limit offset."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradingpricedeviationhigh"

      - alert: TradingSignalStale
        expr: |
          histogram_quantile(0.95,
            sum by (job, book, le) (rate(signal_age_at_decision_seconds_bucket{job=~"trading-engine.*"}[15m]))
          ) > 30
        for: 10m
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "{{ $labels.book }} signals are {{ $value }}s old when checked (p95, 15m)"
          description: "Signals are acted on late: Kafka lag, a slow consumer or clock skew between hosts."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradingsignalstale"

      - alert: TradingTickToTradeSlow
        expr: |
          histogram_quantile(0.99,
            sum by (job, book, le) (rate(signal_to_order_latency_seconds_bucket{job=~"trading-engine.*"}[15m]))
          ) > 10
        for: 10m
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "{{ $labels.book }} signal-to-exchange-ack p99 is {{ $value }}s"
          description: "Tick-to-trade is slow. Compare order_execution_duration_seconds (exchange) with signal_age_at_decision_seconds (pipeline)."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#tradingticktotradeslow"

  - name: order-management-controls
    rules:
      - alert: OrderExchangeSyncStale
        expr: |
          (time() - bitso_sync_last_success_timestamp_seconds{job=~"order-management.*"}) > 300
          and bitso_sync_last_success_timestamp_seconds{job=~"order-management.*"} > 0
        for: 5m
        labels:
          severity: critical
          team: trading
        annotations:
          summary: "Order status not reconciled with Bitso for {{ $value | humanizeDuration }}"
          description: "OMS and exchange may disagree on open orders and fills (reconciliation break risk)."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#orderexchangesyncstale"

      - alert: OrderFillDiscoveryStale
        expr: |
          (time() - user_trades_last_poll_timestamp_seconds{job=~"order-management.*"}) > 300
          and user_trades_last_poll_timestamp_seconds{job=~"order-management.*"} > 0
        for: 5m
        labels:
          severity: critical
          team: trading
        annotations:
          summary: "Fills not polled from Bitso for {{ $value | humanizeDuration }}"
          description: "Positions and P&L (and so the session limits) may be stale."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#orderfilldiscoverystale"

      - alert: OrderRejectRateHigh
        expr: |
          sum by (job) (rate(orders_rejected_total{job=~"order-management.*"}[15m]))
            / sum by (job) (rate(orders_created_total{job=~"order-management.*"}[15m])) > 0.2
          and sum by (job) (increase(orders_created_total{job=~"order-management.*"}[15m])) >= 5
        for: 10m
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "{{ $value | humanizePercentage }} of orders rejected by order-management (15m)"
          description: "Check orders_rejected_total by reason and risk_violations_total by violation_type."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#orderrejectratehigh"

      - alert: OrderFillRatioLow
        expr: |
          sum by (job, book) (increase(orders_filled_total{job=~"order-management.*"}[1h]))
            / sum by (job, book) (increase(orders_created_total{job=~"order-management.*"}[1h])) < 0.5
          and sum by (job, book) (increase(orders_created_total{job=~"order-management.*"}[1h])) >= 5
        for: 30m
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "{{ $labels.book }} fill ratio {{ $value | humanizePercentage }} (1h)"
          description: "Most orders do not fill: limit prices too passive or thin liquidity. Costs and the forward test assume fills."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#orderfillratiolow"

      - alert: OrderSharedPolicyBlockAtOMS
        expr: sum by (job) (increase(risk_violations_total{job=~"order-management.*",violation_type="shared_policy"}[15m])) > 0
        labels:
          severity: warning
          team: risk
        annotations:
          summary: "order-management blocked {{ $value }} order(s) on the shared policy or a halt (15m)"
          description: "Defence in depth fired: an order reached the OMS that the engine gate should have stopped, or arrived by another path."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#ordersharedpolicyblockatoms"

      # --- Execution quality, realized (plan §6.4.7) ---
      - alert: OrderSlippageHigh
        expr: |
          1e4 * (
              sum by (job, book) (increase(order_slippage_cost_quote_total{job=~"order-management.*",direction="adverse"}[6h]))
            - sum by (job, book) (increase(order_slippage_cost_quote_total{job=~"order-management.*",direction="improvement"}[6h]))
          ) / sum by (job, book) (increase(order_filled_notional_quote_total{job=~"order-management.*"}[6h])) > 50
          and sum by (job, book) (increase(order_filled_notional_quote_total{job=~"order-management.*"}[6h])) > 0
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "{{ $labels.book }} realized slippage {{ $value | printf \"%.0f\" }} bps vs decision price (notional-weighted, 6h)"
          description: "Fills are well away from the price the strategy decided on, before fees. The pre-registered cost budget assumes far less; check order type, resting time and liquidity."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#orderslippagehigh"

  - name: portfolio-risk
    rules:
      - alert: PortfolioVaRLimitWarning
        expr: |
          max by (job, currency) (portfolio_var_quote{job=~"order-management.*"})
            / max by (job, currency) (portfolio_var_limit_quote{job=~"order-management.*"}) > 0.8
        for: 5m
        labels:
          severity: warning
          team: risk
        annotations:
          summary: "{{ $labels.currency }} 1-day 99% VaR at {{ $value | humanizePercentage }} of its limit"
          description: "Exposure is approaching the VaR limit. Nothing is blocked automatically; the desk decides whether to reduce."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#portfoliovarlimitwarning"

      - alert: PortfolioVaRLimitBreached
        expr: |
          max by (job, currency) (portfolio_var_quote{job=~"order-management.*"})
            / max by (job, currency) (portfolio_var_limit_quote{job=~"order-management.*"}) >= 1
        for: 1m
        labels:
          severity: critical
          team: risk
        annotations:
          summary: "{{ $labels.currency }} 1-day 99% VaR at {{ $value | humanizePercentage }} of its limit"
          description: "VaR limit breached: escalate to the risk owner, reduce exposure or halt (scripts/k8s-halt.sh)."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#portfoliovarlimitbreached"

      - alert: PortfolioRiskStale
        expr: |
          (time() - portfolio_risk_last_run_timestamp_seconds{job=~"order-management.*"}) > 300
          and portfolio_risk_last_run_timestamp_seconds{job=~"order-management.*"} > 0
        for: 5m
        labels:
          severity: warning
          team: risk
        annotations:
          summary: "Portfolio exposure and VaR not computed for {{ $value | humanizeDuration }}"
          description: "The monitor cannot read positions (see portfolio_risk_run_errors_total); exposure and VaR gauges are frozen."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#portfolioriskstale"

      - alert: PositionUnpriced
        expr: max by (job, book) (position_mark_fallback{job=~"order-management.*"}) == 1
        for: 10m
        labels:
          severity: warning
          team: risk
        annotations:
          summary: "{{ $labels.book }} has an open position but no market price"
          description: "Marked at the entry price (or 0): its exposure and VaR are stale. Check market-data's ticker and MARKET_DATA_URL."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#positionunpriced"

      # VaR model risk (plan §6.4.8). The vol behind the VaR is estimated
      # from Bitso daily closes and backtested over 250 days.
      - alert: VaRBacktestYellow
        expr: max by (job, book) (risk_var_backtest_zone{job=~"order-management.*"}) == 1
        for: 1h
        labels:
          severity: warning
          team: risk
        annotations:
          summary: "{{ $labels.book }} VaR backtest in the Basel yellow zone (5-9 exceptions in 250 days)"
          description: "Losses beyond the 99% VaR are more frequent than 1 in 100 days. Review the model (risk_var_backtest_exceptions, risk_var_backtest_kupiec_pvalue) before relying on the VaR number."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#varbacktestyellow"

      - alert: VaRBacktestRed
        expr: max by (job, book) (risk_var_backtest_zone{job=~"order-management.*"}) == 2
        for: 15m
        labels:
          severity: critical
          team: risk
        annotations:
          summary: "{{ $labels.book }} VaR backtest in the Basel red zone (10+ exceptions in 250 days)"
          description: "The VaR model understates this book's risk. Treat the VaR and its limit as unreliable until the model is fixed; escalate to the risk owner."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#varbacktestred"

      - alert: VaRVolEstimateFallback
        expr: max by (job, book) (risk_var_vol_source{job=~"order-management.*", source="fallback"}) == 1
        for: 30m
        labels:
          severity: warning
          team: risk
        annotations:
          summary: "{{ $labels.book }} VaR uses the configured vol, not an estimate"
          description: "No fresh estimate from Bitso daily closes (fetch failing, no egress to api.bitso.com, or closes older than RISK_VAR_VOL_STALE). The VaR uses RISK_VAR_DAILY_VOL until it recovers."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#varvolestimatefallback"

      - alert: PortfolioVaRModelDivergence
        expr: |
          max by (job, currency) (portfolio_var_historical_quote{job=~"order-management.*"})
            / max by (job, currency) (portfolio_var_quote{job=~"order-management.*"} > 0) > 1.5
        for: 1h
        labels:
          severity: warning
          team: risk
        annotations:
          summary: "{{ $labels.currency }} historical-simulation VaR is {{ $value | printf \"%.1f\" }}x the parametric VaR"
          description: "The last year's actual returns imply a much larger 99% loss than the normal model. The limit applies to the parametric VaR; the desk should judge exposure on the larger number."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#portfoliovarmodeldivergence"

      # Stress scenarios (plan §6.4.9): hypothetical spot shocks and past
      # crypto crises replayed on today's exposure.
      - alert: PortfolioStressLimitBreached
        expr: |
          max by (job, currency) (portfolio_stress_worst_loss_quote{job=~"order-management.*"})
            / max by (job, currency) (portfolio_stress_limit_quote{job=~"order-management.*"}) >= 1
        for: 15m
        labels:
          severity: warning
          team: risk
        annotations:
          summary: "{{ $labels.currency }} worst stress loss at {{ $value | humanizePercentage }} of its stress limit"
          description: "In at least one stress scenario today's exposure would lose more than RISK_STRESS_LIMITS allows (see portfolio_stress_loss_quote by scenario). Nothing is blocked; the risk owner decides whether to reduce."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#portfoliostresslimitbreached"

      - alert: PortfolioStressScenarioIncomplete
        expr: max by (job, currency, scenario) (portfolio_stress_incomplete{job=~"order-management.*"}) == 1
        for: 2h
        labels:
          severity: warning
          team: risk
        annotations:
          summary: "{{ $labels.currency }} stress scenario {{ $labels.scenario }} cannot be computed"
          description: "An exposed book has no Bitso closes for the episode and no book on the same asset does (or the episode fetch keeps failing). The worst stress loss omits this scenario."
          runbook_url: "docs/runbooks/TRADING-RISK-ALERTS.md#portfoliostressscenarioincomplete"
