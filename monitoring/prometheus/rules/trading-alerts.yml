groups:
  - name: trading-alerts
    rules:
      # High error rate in trading engine
      - alert: TradingEngineHighErrorRate
        expr: rate(http_requests_total{job="trading-engine",status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
          service: trading-engine
        annotations:
          summary: "Trading Engine high error rate"
          description: "Trading Engine error rate is {{ $value }} errors per second"

      # API rate limit exceeded
      - alert: APIRateLimitExceeded
        expr: bitso_api_rate_limit_exceeded > 0
        for: 1m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: "Bitso API rate limit exceeded"
          description: "API rate limit exceeded for {{ $labels.endpoint }}"

      # High latency in order execution
      - alert: HighOrderExecutionLatency
        expr: histogram_quantile(0.95, rate(order_execution_duration_seconds_bucket[5m])) > 5
        for: 3m
        labels:
          severity: warning
          service: order-management
        annotations:
          summary: "High order execution latency"
          description: "95th percentile order execution latency is {{ $value }}s"

      # Low available balance
      - alert: LowAvailableBalance
        expr: bitso_available_balance < 1000
        for: 1m
        labels:
          severity: critical
          service: trading-engine
        annotations:
          summary: "Low available balance"
          description: "Available balance is {{ $value }} {{ $labels.currency }}"

      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been down for more than 1 minute"
