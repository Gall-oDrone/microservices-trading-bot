# Prometheus alert rules for the trading platform.
# Phase 4 (METRICS-IMPLEMENTATION-PLAN): critical metrics from Phase 1 trading-engine
# plus existing service/balance/latency alerts.
# Ensure Prometheus rule_files include rules/*.yml and alertmanager is configured.

groups:
  - name: trading-alerts
    rules:
      # --- Service availability ---
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been down for more than 1 minute"

      # --- Phase 4: Balance freshness (Phase 1 metric) ---
      - alert: BalanceLastSuccessTimestampStale
        expr: (time() - bitso_balance_last_success_timestamp_seconds{job=~"trading-engine.*"}) > 300
        for: 2m
        labels:
          severity: critical
          service: trading-engine
        annotations:
          summary: "Bitso balance last success timestamp is stale"
          description: "No successful balance fetch for more than 5 minutes (age {{ $value }}s). Check Bitso API and trading-engine balance fetcher."

      # --- Phase 4: Orders failed rate high (Phase 1 metric) ---
      - alert: TradingEngineOrdersFailedRateHigh
        expr: sum(rate(orders_failed_total{job=~"trading-engine.*"}[5m])) > 0.5
        for: 3m
        labels:
          severity: critical
          service: trading-engine
        annotations:
          summary: "Trading Engine order failure rate is high"
          description: "Order failure rate is {{ $value }}/s over 5m. Check reason labels (validation, bitso_api, session_risk, ticker_fetch) and logs."

      # --- Phase 4: Engine state not running when expected ---
      # Alert when service is up but engine is not in running state (2) for too long (e.g. stuck initializing or stopped).
      - alert: TradingEngineNotRunning
        expr: up{job=~"trading-engine.*"} == 1 and engine_state{job=~"trading-engine.*"} != 2
        for: 5m
        labels:
          severity: warning
          service: trading-engine
        annotations:
          summary: "Trading Engine is up but engine state is not running"
          description: "Engine state is {{ $value }} (0=stopped, 1=initializing, 2=running). Expected 2 when live. Check startup and health."

      # --- Phase 4: Health check failures increasing ---
      - alert: TradingEngineHealthCheckFailuresHigh
        expr: increase(health_check_failures_total{job=~"trading-engine.*"}[15m]) > 5
        for: 2m
        labels:
          severity: warning
          service: trading-engine
        annotations:
          summary: "Trading Engine health check failures are high"
          description: "{{ $value }} health check failures in the last 15 minutes. Check Bitso/Redis connectivity and health monitor."

      # --- Existing: HTTP error rate (if trading-engine exposes HTTP metrics) ---
      - alert: TradingEngineHighErrorRate
        expr: rate(http_requests_total{job=~"trading-engine.*",status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
          service: trading-engine
        annotations:
          summary: "Trading Engine high HTTP error rate"
          description: "Trading Engine HTTP 5xx rate is {{ $value }} errors per second"

      # --- Existing: API rate limit (optional; metric may be from api-gateway or trading-engine) ---
      - alert: APIRateLimitExceeded
        expr: bitso_api_rate_limit_exceeded > 0
        for: 1m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: "Bitso API rate limit exceeded"
          description: "API rate limit exceeded for {{ $labels.endpoint }}"

      # --- Order execution latency (Phase 1 histogram from trading-engine) ---
      - alert: HighOrderExecutionLatency
        expr: histogram_quantile(0.95, sum(rate(order_execution_duration_seconds_bucket{job=~"trading-engine.*"}[5m])) by (le)) > 5
        for: 3m
        labels:
          severity: warning
          service: trading-engine
        annotations:
          summary: "High order execution latency"
          description: "95th percentile order execution latency is {{ $value }}s"

      # --- Signal processing latency ---
      - alert: HighSignalProcessingLatency
        expr: histogram_quantile(0.95, sum(rate(signal_processing_duration_seconds_bucket{job=~"trading-engine.*"}[5m])) by (le)) > 2
        for: 3m
        labels:
          severity: warning
          service: trading-engine
        annotations:
          summary: "High signal processing latency"
          description: "95th percentile signal processing latency is {{ $value }}s"

      # --- Signals dropped (any sustained drop rate) ---
      - alert: SignalsDropped
        expr: sum(rate(signals_dropped_total{job=~"trading-engine.*"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
          service: trading-engine
        annotations:
          summary: "Signals are being dropped"
          description: "Signal drop rate is {{ $value }}/s over 5m. Check reason labels and trading-engine logs."

      # --- Low available balance ---
      - alert: LowAvailableBalance
        expr: bitso_available_balance{job=~"trading-engine.*"} < 1000
        for: 1m
        labels:
          severity: critical
          service: trading-engine
        annotations:
          summary: "Low available balance"
          description: "Available balance is {{ $value }} {{ $labels.currency }}"

  # ============================================================================
  # limit_profit Strategy Alerts
  # ============================================================================
  - name: limit-profit-alerts
    rules:
      # --- Circuit breaker tripped ---
      - alert: LimitProfitCircuitBreakerTripped
        expr: limit_profit_circuit_breaker_active == 1
        for: 0m
        labels:
          severity: critical
          service: strategy-executor
          strategy: limit_profit
        annotations:
          summary: "limit_profit circuit breaker tripped"
          description: "Strategy {{ $labels.strategy }} ({{ $labels.book }}) has hit max_daily_loss_quote limit. Trading paused until daily reset."

      # --- High daily loss approaching limit ---
      - alert: LimitProfitHighDailyLoss
        expr: limit_profit_daily_realized_pnl_quote < -5000
        for: 5m
        labels:
          severity: warning
          service: strategy-executor
          strategy: limit_profit
        annotations:
          summary: "limit_profit daily loss is high"
          description: "Strategy {{ $labels.strategy }} ({{ $labels.book }}) has realized P&L of {{ $value }} MXN. Consider reviewing parameters or pausing."

      # --- Cancel failures increasing ---
      - alert: LimitProfitPendingCancelFailures
        expr: increase(limit_profit_pending_cancel_failures_total[15m]) > 2
        for: 1m
        labels:
          severity: warning
          service: strategy-executor
          strategy: limit_profit
        annotations:
          summary: "limit_profit pending order cancel failures"
          description: "Strategy {{ $labels.strategy }} ({{ $labels.book }}) has {{ $value }} cancel failures in 15m. Check order-management connectivity."

      # --- No entry signals for extended period (when strategy should be active) ---
      - alert: LimitProfitNoEntrySignals
        expr: |
          strategy_executor_strategy_running{strategy=~".*limit_profit.*"} == 1
          and
          increase(limit_profit_entry_signals_total[30m]) == 0
        for: 30m
        labels:
          severity: warning
          service: strategy-executor
          strategy: limit_profit
        annotations:
          summary: "limit_profit no entry signals"
          description: "Strategy {{ $labels.strategy }} is running but no entry signals in 30m. Check market conditions, indicators, or circuit breaker."

      # --- Position held too long (may indicate stuck position or fill issue) ---
      - alert: LimitProfitLongPositionHold
        expr: limit_profit_position_hold_duration_seconds_sum / limit_profit_position_hold_duration_seconds_count > 600
        for: 5m
        labels:
          severity: warning
          service: strategy-executor
          strategy: limit_profit
        annotations:
          summary: "limit_profit average position hold time is high"
          description: "Strategy {{ $labels.strategy }} ({{ $labels.book }}) average position hold is {{ $value }}s. May indicate market conditions or configuration issue."

      # --- Strategy stopped unexpectedly ---
      - alert: LimitProfitStrategyStopped
        expr: |
          strategy_executor_strategy_running{strategy=~".*limit_profit.*"} == 0
          and
          (time() - strategy_executor_indicators_last_update_timestamp) < 120
        for: 5m
        labels:
          severity: warning
          service: strategy-executor
          strategy: limit_profit
        annotations:
          summary: "limit_profit strategy stopped"
          description: "Strategy {{ $labels.strategy }} is not running. Verify if intentional or restart needed."

  # ============================================================================
  # market-data trade stream freshness
  # ============================================================================
  - name: market-data-freshness-alerts
    rules:
      - alert: MarketDataTradeStreamStale
        expr: market_data_last_trade_age_seconds{job=~"market-data.*"} > 300
        for: 2m
        labels:
          severity: critical
          service: market-data
        annotations:
          summary: "market-data trade stream is stale"
          description: "No WebSocket trades for {{ $value }}s (>5m). REST fallback and silence watchdog should be active; verify Last Trade logs and Bitso Stage connectivity."

      - alert: MarketDataTradeSilenceReconnectsHigh
        expr: increase(market_data_trade_silence_reconnects_total{job=~"market-data.*"}[1h]) > 3
        for: 0m
        labels:
          severity: warning
          service: market-data
        annotations:
          summary: "market-data repeated silence-triggered reconnects"
          description: "{{ $value }} watchdog reconnects in the last hour — investigate WS stability."

      - alert: StrategyExecutorIndicatorsUnhealthy
        expr: strategy_executor_indicators_healthy{job=~"strategy-executor.*"} == 0
        for: 5m
        labels:
          severity: warning
          service: strategy-executor
        annotations:
          summary: "strategy-executor indicators unhealthy"
          description: "Bar-first compute marked indicators unhealthy — router should block routing; check market-data trade stream and snapshot last_bar_age_sec."

  # ============================================================================
  # Infrastructure Alerts (Redis, Kafka)
  # ============================================================================
  - name: infrastructure-alerts
    rules:
      # --- Redis down ---
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is down"
          description: "Redis exporter reports Redis is not responding. Strategy state persistence and indicators may be affected."

      # --- Redis memory high ---
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory usage is {{ $value | humanizePercentage }}. Consider cleanup or increasing maxmemory."

      # --- Redis connected clients high ---
      - alert: RedisConnectedClientsHigh
        expr: redis_connected_clients > 100
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis connected clients is high"
          description: "Redis has {{ $value }} connected clients. Check for connection leaks."

      # --- Kafka consumer lag (if metric available) ---
      - alert: KafkaConsumerLagHigh
        expr: kafka_consumer_group_lag > 1000
        for: 5m
        labels:
          severity: warning
          service: kafka
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer group {{ $labels.group }} has lag of {{ $value }} messages on topic {{ $labels.topic }}."
