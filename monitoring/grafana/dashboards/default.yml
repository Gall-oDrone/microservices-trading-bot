# Dashboard provider: load all JSON dashboards from this directory.
# Ensures "Trading Platform Metrics" (including Intraday / P&L row) is available.
apiVersion: 1

providers:
  - name: "Trading"
    orgId: 1
    folder: "Trading"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
