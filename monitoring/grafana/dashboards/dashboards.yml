# Dashboard provisioning: load all JSON dashboards from this path (and subdirs).
# Mount point in container: /etc/grafana/provisioning/dashboards
apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
